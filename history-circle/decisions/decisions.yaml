  원문_보존:
  - id: architecture-shorts:31
    date: 10/17
    status_hint: 현행후보
    text: '- 시리즈의 주인공은 도시다(10/17 사용자 결정). 기획은 컨셉 12-1 프롬프트(도시공학자 / 건축사학자 / 기획자)의 출력 순서를 따른다: 도시 후보 표 → 도시 연표 + 건축 카드 → 키프레임 + 대본 → 미확인·결정 사항. 기획 산출물은 Claude Docs 제작 문서로'
  - id: channel-concept:47
    date: 10/17
    status_hint: 현행후보
    text: '- [확정 10/17] **건축·도시 시리즈(''도시의 일생'')는 12-1 프롬프트의 세 역할(도시공학자 / 건축사학자 / 유튜브 기획자 겸 영상 디자이너)로 검토한다** — 12-1'
  - id: channel-concept:267
    date: 10/13
    status_hint: 보류후보
    text: '- [확정 10/13] 건축·도시 시리즈는 우선 **쇼츠 45초**로 시작한다(history-architecture-shorts). 롱폼 확장은 반응을 보고 정한다 [제안]. 도시의 일생 1편은 약 58초(10/17)'
  - id: channel-concept:328
    date: 10/13
    status_hint: 현행후보
    text: '| 10/13 | 건축·도시 시리즈 신설(역사서클 안). 여러 시대·나라, 실사 복원 + 코드 도해, 양식 반·개발 논리 반. 역할 3(건축·도시 전문가) 추가. 쇼츠부터 시작(12번, history-architecture-shorts) |'
  - id: channel-concept:356
    date: 10/17
    status_hint: 현행후보
    text: '- [확정 10/17] **시리즈의 주인공은 도시다.** 사용자가 궁금한 것: "한 도시가 왜 그 자리에서, 그 모양으로 자랐고, 시대마다 건물은 왜 그렇게 생겼나." 성곽·궁궐·탑 같은 개별 건축은 그 이야기의 부품으로 다룬다'
  - id: channel-concept:360
    date: 10/17
    status_hint: 현행후보
    text: '- [확정 10/17] **해석을 적극적으로 쓴다**(5·5-1번): 단계마다 "이때 수도는 숨는 곳이었다"처럼 [해석] 한 줄로 도시의 성격을 이름 붙인다. 기록·발굴과 해석은 대본 태그 열과 설명란에서 구분한다'
  - id: channel-concept:366
    date: 10/13
    status_hint: 현행후보
    text: '- [확정 10/13] 관점: 양식 반, 개발 논리 반 — 도시의 일생에서는 ''개발 논리''가 입지·확장·밀도·인프라 해석으로 들어간다. 사용자 본업(상업용 부동산 개발·투자)이 검토 관점이다. 개발 논리 비유는 대본에 넣는다(10/17 1편: ''집과 대피소를 한 단지에 모은 복합 개발'')'
  - id: channel-concept:369
    date: 10/17
    status_hint: 현행후보
    text: '### 12-1. 프롬프트 — 도시의 일생 [확정 10/17]'
  - id: channel-concept:427
    date: 10/17
    status_hint: 현행후보
    text: '- 자료 충분도가 낮은 도시(수도 기간이 짧거나 면적·가로망 자료가 없는 곳)는 단독 편으로 만들지 않고, 이어지는 도시들과 묶어 ''이사'' 또는 ''비교'' 편으로 만든다(10/17 졸본 사례) [확정 10/17]'
  - id: shorts:85
    date: 10/04
    status_hint: 현행후보
    text: '- ⑨ 활 하나 꺾었다고 태자가 죽어야 했다고?(해명태자, 기록상 AD 8~9) — **완료**(45.16초, 2026-10-04, v7.6 첫 적용: 8장면, 약 300자 44.4초 = 초당 6.7자). 사용자 요청으로 ''사건''이 아니라 **외교 문제**(굽힐 것인가 맞설 것인가)로 구성. 근거: 한국민족문화대백과 ''해명''(책봉 AD 4, 졸본 잔류, 황룡국 왕의 활을 꺾음, 유리왕이 황룡국에 죽여 달라고 청함, 황룡국 왕은 죽이지 못함, AD 9 칼을 내려 자결 명령, 여원 동쪽 들에서 창에 찔려 죽음, 창원). 나이 21세·대사는 위키백과 인용(원문 미확인, 생몰년 BC 12~AD 9와는 일치). ''복종하라는 활''·''외교 마찰''은 [해석](나무위키 각주 수준 — 설명란 고지). 황룡국 위치는 [미상] → 졸본 서쪽에 임의 색칠 영역. 6번 장면에 도트 기마 무사. 끝은 시청자 질문("여러분이 왕이었다면…"), 다음 편 예고는 고정 댓글. 크레딧 약 21.6(첫 장면 후보 8장 포함)'
  - id: shorts:86
    date: 10/23
    status_hint: 현행후보
    text: '- **⑩ 이후 (2026-10-23 갱신)**: 롱폼 대무신왕 3부작 완성(1부 10/6 · 2부 10/14 · 3부 10/17). 재편집 숏츠: 1부 5편(10/7 — ① 예고편 0:00–0:57 ② 열 살에게 맡겼다고? ③ 매복을 길가에 안 숨겼다고? ④ 대군이 한 줄로 갇혔다고? ⑤ 붉은 까마귀), 2부 5편(history-longform 0번), 3부 진행(설정 백업 history-production-standards 4절). 신작: 온조 비트 예고편 v2(10/20, 음악만 — standards 5절). 건축: 「고구려 수도에 성이 두 개였다고?」(10/14) · 온돌 편(10/19, history-architecture-shorts). 업로드 여부·지표는 미기록 → 다음 작업 때 사용자에게 받아 적는다. 다음 롱폼 = 백제 온조(마한 병합). 롱폼 진행 상황은 history-longform 0번이 기준'
