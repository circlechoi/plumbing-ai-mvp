# 결정 원장 — 사람이 정리하는 큐레이션본 (build_ledger.py가 이 파일 + decisions_raw.yaml로 decisions.yaml을 만든다)
# 규칙
# - current = 지금 따를 값 1개. 원문을 줄이지 않는다(요약은 summary, 원문은 sources로 추적).
# - status: 현행 | 사용자확정대기(conflicts.md 참고) | 보류
# - sources = decisions_raw.yaml의 id(스킬명:줄). 같은 주제의 이전 결정도 여기 묶어 '어디서 바뀌었는지' 남긴다.
# - superseded = 이 항목이 대체한 이전 결정 id (삭제가 아니라 이력 보존)

meta:
  principle: "충돌 시 날짜가 붙은 최신 사용자 결정 우선. 날짜가 같거나 없으면 channel-concept > longform·architecture-shorts > shorts (10/23)"
  principle_sources: [channel-concept:9, longform:12, production-standards:10, architecture-shorts:11, shorts:8, longform:102, production-standards:136]
  user_over_review: "사용자와 대화로 정한 내용 > 검수 의견. 검수 의견이 합의 구성을 빼거나 흐리면 반영하지 말고 충돌을 보여 주고 고르게 한다 (10/25)"
  user_over_review_sources: [production-standards:33, production-standards:30, production-standards:140]

topics:

- name: 대본·오프닝
  items:
  - key: identity
    current: "정체성 한 문장 '그 판단은 왜 그랬을까?' — 역사/전략 시네마틱. 한 편 = 결정 하나 = 질문 하나, 답 하나"
    status: 현행
    sources: [channel-concept:309, channel-concept:68, channel-concept:53, channel-concept:312]
  - key: episode_formula
    current: "딜레마 → 당신이라면?(선택지 한 줄씩) + 실제 선택(이유 둘 이내, 한 구간) → 결과 → 판단 분석(1~2분, 심의 메모 5칸, 초고는 사용자) → 남긴 것"
    status: 현행
    sources: [channel-concept:310, channel-concept:71, channel-concept:73, channel-concept:74, channel-concept:76, channel-concept:325, longform:86, channel-concept:329, longform:90, channel-concept:97, channel-concept:98, channel-concept:62]
  - key: opening_hook
    current: "편의 첫 화면 = 줄거리 요약 훅(배경지식 0·초등학생 기준): 아는 이름 → 약자의 출발 → 결말 한 문장 → '어떻게' 질문 → 시그니처 → 제목. 롱폼 내레이션 약 15초 + 시그니처 3초, 쇼츠(신작·재편집)는 2문장 6~8초"
    status: 현행
    sources: [channel-concept:233, channel-concept:340, longform:104, longform:208, channel-concept:69, channel-concept:6]
    superseded: [channel-concept:324, longform:85, longform:98, longform:216, longform:103, shorts:187, shorts:26, channel-concept:348]
    note: "10/12 콜드 오픈 → 10/17 전투 컷 플래시 → 10/23 E2 질문 먼저 → 10/25 줄거리 요약 훅(현행). 전투 컷 플래시는 결말 문장의 화면으로 흡수"
  - key: battle_shorts_first3s
    current: "전투 해설 쇼츠 첫 3초 규칙 8항목(첫 문장 2.5초 안, 0초부터 화면 30% 이상 움직임, 훅에서 반전 답 공개 금지 등) + 배경 한 줄은 첫 10초 안(줄거리 요약 훅을 따름)"
    status: 현행
    sources: [battle-shorts:45]
    note: "원문 battle-shorts 1절(11/2) — 날짜 표기가 줄 머리에 없어 raw 추출에는 45행만 잡힘"
  - key: narration_style
    current: "합니다체 바탕 + '~죠/~요/~인데, 하지만' 이어 말하기 대화체, 평서 '~다.' 종결 0회, 같은 어미 연속 0회. 롱폼은 딜레마 + 수 싸움 + 떡밥 (11/02)"
    status: 현행
    sources: [longform-craft:55, shorts:201, shorts:10, longform:95, longform:77, shorts:200, shorts:24]
    note: "10/5 '설명하듯 이어지는 합니다체' → 10/16 대화체 → 10/23 쇼츠 합니다+죠/요 → 11/02 롱폼 떡밥·이어 말하기. 서로 누적 관계(충돌 아님)"
  - key: opponent_rational
    current: "상대를 바보로 그리지 않는다. 상대의 계산을 먼저 그럴 만하게 보여 주고, 진 쪽에도 판단의 논리를 준다"
    status: 현행
    sources: [channel-concept:56, channel-concept:147, channel-concept:315, battle-shorts:16]
  - key: three_layer_question
    current: "세 겹 질문(세계·나라·전장). 국제 정세는 '틈'으로 1~2분 안에, 깊이는 전장 겹. 전술 전에 전략의 이유 먼저"
    status: 현행
    sources: [channel-concept:57, channel-concept:82, channel-concept:91, channel-concept:152, channel-concept:79, channel-concept:316, channel-concept:345]
  - key: historical_imagination
    current: "기록이 한 줄이어도 역사적 상상력으로 해석하되 상상임을 밝힌다. 신이한 기사는 '기록은 이렇게 전합니다 → 오늘의 눈으로 읽으면' 두 단계. 학설이 갈리면 주류 설로 진행, 나머지는 설명란"
    status: 현행
    sources: [channel-concept:58, channel-concept:155, channel-concept:156, channel-concept:320, channel-concept:150, channel-concept:151, shorts:145, shorts:142]
  - key: radio_test
    current: "라디오 기준: 소리만으로 이해되게. 화면에만 있는 정보는 없다(자막·지도·카드에 적힌 것은 모두 소리로도)"
    status: 현행
    sources: [channel-concept:311, channel-concept:120, channel-concept:200]
  - key: battle_section
    current: "전투 구간은 없애지 않고 영상미를 위해 충분히 둔다. 전투 해설 쇼츠는 결정적 전술 이름을 내레이션·화면·제목에서 분명히"
    status: 현행
    sources: [channel-concept:54, channel-concept:132, battle-shorts:45, channel-concept:136, channel-concept:313]
  - key: dot_sprite
    current: "매 편 도트 그림 1곳 이상(롱폼·쇼츠·건축). 금지 구간: 죽음·비극, 판단 분석. 롱폼은 우측 하단 구석에 작게"
    status: 현행
    sources: [channel-concept:60, channel-concept:240, channel-concept:241, channel-concept:332, shorts:192, longform:96]
    superseded: [shorts:17]
  - key: topic_filter
    current: "뻔함 필터: 의외의 주인공·충격적 결정·처음 듣는 기록 중 하나 이상. 롱폼과 겹치는 사건은 신작으로 다시 만들지 않는다"
    status: 현행
    sources: [shorts:68, shorts:42]

- name: 지도
  items:
  - key: map_version
    current: "지도 바탕 = v4-S(실제 고도·하천 + 삼국전투기 스타일 산지), 롱폼·쇼츠 공통. v3의 '국경은 지형(분수령)·세력 면 진한 저채도' 문법은 v4-S 위에서 유지"
    status: 사용자확정대기
    sources: [map-v4:10, map-v4:84, longform:184, longform:82, channel-concept:207, channel-concept:219, channel-concept:322, channel-concept:223, shorts:973, shorts:985, shorts:1052]
    conflict: C1
  - key: map_unit_marker
    current: "부대 표시: 전투 해설 쇼츠 = 'ㅗ' 블록 + 블록 안 병종 도트 아이콘(글자·범례 없음, 11/2). 롱폼 = 도트 기마병 스프라이트(10/16)"
    status: 사용자확정대기
    sources: [battle-shorts:88, longform:193]
    conflict: C6
  - key: box_size_uniform
    current: "붉은 인장 상자는 영상 전체에서 크기 통일(seal_uniform, 10/16). 유닛 블록·병력 박스의 고정 규격은 아직 없음 → 세션 2 지도 컴포넌트에서 규격 제안"
    status: 현행
    sources: [longform:97]
  - key: map_terrain_placement
    current: "전장 배치는 DEM으로 능선·골짜기·고개를 읽고 기록 문구를 지형에 대응시킨 뒤 놓는다(근거는 [추정]으로 기획안에)"
    status: 현행
    sources: [battle-shorts:85]
  - key: map_territory_by_record
    current: "영역은 그 시점의 기록으로 그린다(근거는 대본 표에). 전략도 보조 라벨은 그 편 판단에 필요한 것만"
    status: 현행
    sources: [channel-concept:221, channel-concept:222, longform:83]
  - key: map_markers_architecture
    current: "건축 시리즈 지도 표지 = render.py markers(붉은 원 + 이름 + 부제)"
    status: 사용자확정대기
    sources: [architecture-shorts:23]
    conflict: C5
    note: "부제 '[통설] …' 표기가 11/02 '화면 태그 전부 삭제'와 충돌"

- name: 화면·색
  items:
  - key: palette
    current: "모든 편 바탕 = 정통 청록산수(차가운 석청·석록, 맑은 낮빛). 나라 색은 그 나라 왕·군사에만 포인트(백제 황금, 신라 주홍). golden hour 등 화면 전체 금빛 톤 프롬프트 금지"
    status: 현행
    sources: [production-standards:14, production-standards:25, production-standards:139, shorts:252, shorts:255, production-standards:135]
  - key: faction_colors
    current: "세력 색 RGB — conflicts.md C4에서 확정 필요(고구려 (96,34,29) / 부여 (42,58,86) / 백제 황금 (232,184,56) / 신라 주홍 (226,96,52) / 당 (70,74,84) / 왜 (206,32,46) / 마한 (178,120,168) / 말갈 (118,86,62) / 낙랑 = 올리브 (70,74,22) 또는 먹회색 (84,88,102))"
    status: 사용자확정대기
    sources: [channel-concept:220, map-v4:54]
    conflict: C4
  - key: costume_colors
    current: "전투 컷 세력 색 엄수: 고구려 붉은 옷·붉은 깃발 / 부여 흰 옷·짙은 모피. 돌격 컷은 앞에 적의 색만, 뒤에 아군의 색만"
    status: 현행
    sources: [channel-concept:204, longform:71, longform:87, shorts:267, channel-concept:326]
  - key: signature_opening
    current: "시그니처 오프닝(수묵화 → 먹 번짐 → 실사) 채널 고정. 쇼츠는 3초 축약판, 건축은 건물 선묘 스케치"
    status: 현행
    sources: [channel-concept:59, channel-concept:228, channel-concept:231, channel-concept:323, longform:84, longform:199, shorts:188, channel-concept:363]
  - key: ai_look_reduction
    current: "AI 티·반복 금지(E-6): 같은 컷 반복, 5초 클립 늘이기, 긴 정지 지도 금지. 정지 화면은 구간별 상한(편당 총량 상한은 폐지). 사람 컷 3초·원경 5초. 실사는 컷당 동작 하나, 실제 카메라 이동, 채도 낮은 필름 톤. 립싱크 금지"
    status: 현행
    sources: [longform:101, longform:240, longform:102, longform-craft:51, longform-craft:57, longform-craft:58, channel-concept:303, channel-concept:338]
  - key: parallax
    current: "시점 흔들기 = 층 분리(B안)"
    status: 현행
    sources: [longform-craft:53, longform-craft:111]
  - key: realshot_hook
    current: "실사 훅 연출(11/02~03, 4차c 품질 승인) — longform-craft 9절"
    status: 현행
    sources: [longform-craft:118, longform-craft:60, longform-craft:59]
  - key: judgment_screen
    current: "판단 분석 화면 = 먹 글씨(붉은 상자 라벨 금지). 판세 계기판 삭제"
    status: 현행
    sources: [longform:99, longform:260, longform-craft:61]
  - key: on_screen_tags
    current: "화면의 [기록]/[통설]/[해석]/[연출] 태그·칩 전부 삭제(11/02) — 롱폼 확정. 쇼츠·건축 적용 범위는 C5"
    status: 사용자확정대기
    sources: [longform-craft:56, shorts:19]
    conflict: C5
  - key: gore
    current: "피 수위: 튀는 피·피 묻은 얼굴·창끝까지. 상처 클로즈업·절단 금지, 참수는 화면 밖. 유튜브 '변경·합성 콘텐츠' 표시, 카테고리 교육"
    status: 현행
    sources: [longform:72, longform:322]
  - key: realism_physics
    current: "고증이 몰입을 지킨다: 지형·계절의 물리(진창 깊이 등)·진영 규모가 어긋나면 결함"
    status: 현행
    sources: [channel-concept:205, longform:81, channel-concept:143]
  - key: architecture_visual
    current: "건축 시리즈: 실사 복원 + 한지 먹선 도해(진사 강조 1색). 그림이 주인공인 장면은 AI 그림 + 코드 표지. 청록산수 안 씀"
    status: 현행
    sources: [channel-concept:364, channel-concept:365, architecture-shorts:17, architecture-shorts:15]

- name: 자막·서체
  items:
  - key: shorts_captions
    current: "쇼츠 자막 송명, 1줄 ≤13자 60px / 2줄 ≤10자 80px(마지막 84). 상단 제목 영상 내내(첫 장면 92px → 80% y392 고정). 연도 배지 = 붉은 낙관 '史' + 금색 글자. 워터마크 '역사서클' 글자"
    status: 현행
    sources: [shorts:235, shorts:236, shorts:237, shorts:248, shorts:249, shorts:21, architecture-shorts:19, architecture-shorts:172]
  - key: battle_title_bar
    current: "전투 해설 쇼츠 상단 = 편 제목 고정 한 줄(NotoSansKR Black 52), 강조어는 진빨강 (172,34,28) 둥근 상자 + 크림 글씨"
    status: 현행
    sources: [battle-shorts:66]
  - key: longform_captions
    current: "롱폼 자막 서체·크기 — C7 확정 필요(10/4 나눔명조 ExtraBold 56 vs map-v4 레터박스 NotoSansKR Bold 46 vs craft 배역 대사 나눔명조 Bold 44)"
    status: 사용자확정대기
    sources: [longform:75]
    conflict: C7
  - key: numbers
    current: "내레이션 숫자는 한글로 쓰고 자막은 숫자로 따로"
    status: 현행
    sources: [longform-craft:72]

- name: 내레이션·TTS
  items:
  - key: voice
    current: "내레이터 Harrison(qwen preset 573e5163…), language ko, instruction ≤128자 '차분한 다큐·또박또박·일정한 속도', seed 7. 판단 분석 구간은 사용자 직접 녹음(실험 E5)"
    status: 현행
    sources: [longform:70, longform-craft:72, battle-shorts:144, channel-concept:111, longform:277]
  - key: role_voices
    current: "배역 목소리 원칙 — C8 확정 필요(10/29 '배역 목소리 폐기, 내레이터 인용' vs 11/03 '사신 목소리 Alistair')"
    status: 사용자확정대기
    sources: [longform-craft:50, longform-craft:59]
    conflict: C8
  - key: recording_unit
    current: "문단 단위 통째 녹음 → loudnorm I=-17 → whisper 단어 시각 → 분할 → 같은 atempo. 고칠 줄만 같은 설정으로 다시 녹음. 고립 음절·문장 중간 쉼 자동 점검"
    status: 현행
    sources: [longform-craft:72, battle-shorts:134]
  - key: tempo
    current: "TTS 배속 — C2 확정 필요(롱폼 1.10 / 쇼츠·전투 1.08, 편 안에서 단일 값 권장)"
    status: 사용자확정대기
    sources: [longform:76, longform:95]
    conflict: C2

- name: 음량·효과음
  items:
  - key: loudness
    current: "내레이션 −17 LUFS. 최종 마스터 — C3 확정 필요(롱폼 −14 / 쇼츠 −15, TP −1.5 권장)"
    status: 사용자확정대기
    sources: [channel-concept:111, longform:277]
    conflict: C3
  - key: sfx_under_vo
    current: "효과음 자동 상한: 모든 효과음은 내레이션보다 작게(10/16). 음량은 피크가 아니라 RMS 기준. 몰입 구간 현장음 앞, 해설 구간 정돈"
    status: 현행
    sources: [longform:93, longform:88, channel-concept:135, channel-concept:326]
    note: "dB 여유폭(예: 효과음 RMS ≤ 내레이션 −3dB)은 수치로 정해진 적 없음 → C3에 함께 확정 요청"
  - key: sfx_source
    current: "Kling 영상은 소리 끔(sound 'off' 문자열). 효과음은 mirelo로 따로, 쇼츠는 코드 합성 기본. 효과음 글자는 지도·도식에서만"
    status: 현행
    sources: [longform:94, longform:281, longform-craft:51]
  - key: music
    current: "음악 = 사용자 Suno 유료 곡. 롱폼 현행 곡 Gayageum Hook. 장면별 곡 배정은 Claude가 RMS 곡선으로 고르고 사용자 승인. BGM 4무드(standards)"
    status: 현행
    sources: [longform:79, longform-craft:54, longform:100, longform:363]

