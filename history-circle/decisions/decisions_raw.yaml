  text: '| 10/25 | 오프닝 = 줄거리 요약 훅(7-2): 아는 이름 → 약자의 출발 → 결말 한 문장 → ''어떻게'' 질문, 초등학생 기준. 롱폼 약 15초 + 시그니처, 쇼츠(신작·재편집 공통)는 2문장 6~8초 — 온조 재편집 앞머리 7.5초에 첫 적용. 롱폼 첫 시청자 리뷰어 = 배경지식 0(history-longform B-0). 10/23 ''질문 먼저''(E2)를 대체 |'
