  text: '- **프롬프트 금지어**: `golden hour`, `golden light`, `warm golden glow`, `sunset light`(노을 장면이 서사상 꼭 필요할 때만 예외), `warm ochre` 전체 톤. 이 말이 들어가면 화면 전체가 황색으로 덮여 백제 포인트와 구분이 사라진다(10/25 탈해 편에서 실제 발생 — 사용자 지적 "미감이 없다, 백제 황색과 너무 겹친다").'
