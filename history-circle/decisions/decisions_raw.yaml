  status: 현행후보
  text: 'v7.5 변경(2026-10-03, ⑥·⑦ 공개 후 사용자 피드백): ① **자막 확대** 1줄 60 / 2줄 80(마지막 84) ② **제목을 영상 내내 표시** — 첫 장면 뒤 80%로 줄어 상단(y 392)에 고정 ③ **템포를 늦춤** — 8~9장면, 장면당 4.5초 이상, 같은 그림 재확대 컷 금지 ④ **끝 여운 단축** — "다음 이야기에서"를 읽지 않고 자막으로만, 마지막 단어 뒤 0.6초에 종료 ⑤ **''~다, ~다'' 반복 금지** 문체 규칙(D-2) ⑥ 주제 ''뻔함 필터''(A-2)와 조회 지표 기록(H) ⑦ **롱폼과 같은 의상 색 포인트**(고구려 붉은색 / 부여 흰색+검은색)와 **밝고 강한 첫 장면**(E).'
