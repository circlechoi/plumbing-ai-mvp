  status: 현행후보
  text: '> **우선순위(10/23 확정)**: 스킬끼리 충돌하면 **날짜가 붙은 최신 사용자 결정**을 따른다. 날짜가 같거나 없으면 history-channel-concept > history-longform · history-architecture-shorts > history-shorts. 작업 중 낡은 문장을 발견하면 그 문장을 따르지 말고, 사용자에게 알리며 고칠 곳을 제안한다.'
- id: architecture-shorts:15
  date: 10/13
  skill: history-architecture-shorts
  line: 15
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/13] 사용자 결정: 역사서클 안 새 시리즈 / 실사 복원 + 코드 도해 / 양식 반·개발 논리 반'
- id: architecture-shorts:17
  date: 10/13
  skill: history-architecture-shorts
  line: 17
  kind: 날짜+결정어
  status: 현행후보
  text: '- 도해 그림체 = 한지 먹선(10/13 사용자 결정), 단 그림이 주인공인 장면은 AI 그림 + 코드 표지(10/14). 도트 = 깨알 등장만'
- id: architecture-shorts:19
  date: 10/19
  skill: history-architecture-shorts
  line: 19
  kind: 날짜+결정어
  status: 현행후보
  text: '## ★ 화면 포맷은 반드시 history-shorts 표준 (10/19 사용자 지시)'
- id: architecture-shorts:23
  date: 10/19
  skill: history-architecture-shorts
  line: 23
  kind: 날짜+결정어
  status: 현행후보
  text: '- 지도 위 표지는 render.py anim.json `markers`(붉은 원 + 이름 + `[통설] …` 부제)로. × 표시 대신 이 표지를 쓴다(10/19 사용자 지정)'
- id: architecture-shorts:26
  date: 10/23
  skill: history-architecture-shorts
  line: 26
  kind: 날짜+결정어
  status: 현행후보
  text: '## 0. 형식 (10/23 확정 — concept 12)'
- id: architecture-shorts:27
  date: 10/23
  skill: history-architecture-shorts
  line: 27
  kind: 확정표기
  status: 현행후보
  text: '- **기본 = ''그 시절 ○○''**: 2번 비트(개별 건축 편)로 만든다. **[10/23] 질문은 판단 언어로** — "왜 그렇게 짓기로 했을까?"(제약 → 선택 → 대가). 2번 비트의 ''당신이라면?→해법''이 곧 판단 구간이다. 1편 쪽구들(0-2). 다음 편 후보는 1번 체크포인트 표로 낸다'
- id: architecture-shorts:31
  date: 10/17
  skill: history-architecture-shorts
  line: 31
  kind: 날짜+결정어
  status: 현행후보
  text: '- 시리즈의 주인공은 도시다(10/17 사용자 결정). 기획은 컨셉 12-1 프롬프트(도시공학자 / 건축사학자 / 기획자)의 출력 순서를 따른다: 도시 후보 표 → 도시 연표 + 건축 카드 → 키프레임 + 대본 → 미확인·결정 사항. 기획 산출물은 Claude Docs 제작 문서로'
- id: architecture-shorts:141
  date: 10/19
  skill: history-architecture-shorts
  line: 141
  kind: 날짜+결정어
  status: 현행후보
  text: '- **설명란 = history-shorts J의 쇼츠 공통 양식**(10/19 이 시리즈에서 사용자가 확정한 것을 10/23 쇼츠 전체로 넓힘 — 원본은 J). 이 시리즈만의 차이: ① 그림 고지 첫 줄에 `{단면도 등}은 복원 추정입니다.` ② 해시태그 끝에 `#건축`. 아래는 10/19 원래 기록(참고):'
- id: architecture-shorts:148
  date: 10/19
  skill: history-architecture-shorts
  line: 148
  kind: 날짜+결정어
  status: 현행후보
  text: '- 실제 예(10/19 온돌 편, 사용자 수정본):'
- id: architecture-shorts:168
  date: 10/13
  skill: history-architecture-shorts
  line: 168
  kind: 변경이력표
  status: 현행후보
  text: '| 10/13 | 시리즈 신설: 역사서클 안, 여러 시대·나라, 실사 복원 + 코드 도해, 양식 반·개발 논리 반. 세 역할 프롬프트(컨셉 12-1). 시그니처 3초는 건물 선묘 스케치로 유지 |'
- id: architecture-shorts:170
  date: 10/17
  skill: history-architecture-shorts
  line: 170
  kind: 변경이력표
  status: 현행후보
  text: '| 10/17 | 시리즈 중심을 ''도시의 일생''으로(컨셉 12번). 블록 성장 지도 문법(레퍼런스: 베이징 타임랩스). 첫 도시 졸본 |'
- id: architecture-shorts:171
  date: 10/18
  skill: history-architecture-shorts
  line: 171
  kind: 변경이력표
  status: 폐기후보
  text: '| 10/18 | 졸본 편 중단(메시지가 모호하다는 사용자 판단). ''그 시절 고구려는 어떻게 지냈을까'' 틀로 재출발, 음식 제외·건축·도시만. 1편 = 쪽구들, 엔딩은 다음 편 예고 없이 ''오늘''로 회수 |'
- id: architecture-shorts:172
  date: 10/19
  skill: history-architecture-shorts
  line: 172
  kind: 변경이력표
  status: 현행후보
  text: '| 10/19 | 쇼츠는 history-shorts 표준 포맷(render.py v7.6) 필수. 지도 표지는 붉은 원 markers. 설명란은 사용자 수정 양식(10번) |'
- id: architecture-shorts:173
  date: 10/23
  skill: history-architecture-shorts
  line: 173
  kind: 변경이력표
  status: 보류후보
  text: '| 10/23 | 형식 = ''그 시절 ○○'' 기본 + ''도시의 일생'' 보류(수도 세 번 이사 편 보류) / 설명란 원본은 history-shorts J / 태그는 컨셉 마스터 표 / 충돌은 최신 날짜 결정 우선 |'
- id: battle-shorts:16
  date: 11/03
  skill: history-battle-shorts
  line: 16
  kind: 날짜+결정어
  status: 현행후보
  text: '- **진 쪽을 바보로 만들지 않는다**(11/3 사용자 결정, 4편 8장면): ''말을 그대로 믿었다''로 끝내지 말고 ''속셈은 읽었지만 그 뒤의 의도를 잘못 읽었다''처럼 판단의 논리를 준다(고연수: 태종이 정변 뒤 반대파를 흔들려는 걸 알지만, 먼저 꺼낸 화친을 ''당군이 지쳤다''는 신호로 읽음). 원문과 다른 해석이면 설명란에 원문을 함께 적는다(延壽信之 不復設備).'
- id: battle-shorts:28
  date: 11/02
  skill: history-battle-shorts
  line: 28
  kind: 날짜+결정어
  status: 현행후보
  text: '- **설명보다 시안**(11/2 사용자: ''설명하는 게 뭔지 모르겠어, 시안을 먼저 보자''): 화면 연출을 말로 길게 풀지 말고 정지 프레임(0크레딧)을 먼저 그려 보여 준다.'
- id: battle-shorts:45
  date: 11/03
  skill: history-battle-shorts
  line: 45
  kind: 날짜+결정어
  status: 현행후보
  text: '- **결정적 전술 이름을 내레이션·화면·제목에서 분명히**(11/3 사용자: ''전투해설 쇼츠니까 전투에 포커싱, 포위 섬멸이 더 잘 보이게''): 방향을 열거하는 한 문장("서쪽, 북쪽, 그리고 등 뒤. 세 방향에서 포위가 닫힙니다.") + 결과 확정 문장("15만 대군은 그렇게, 포위 속에서 섬멸됩니다.") + 화면 도식(3-4절).'
- id: battle-shorts:66
  date: 11/03
  skill: history-battle-shorts
  line: 66
  kind: 날짜+결정어
  status: 폐기후보
  text: '- **상단 = 편 제목 고정 한 줄**(크림색 띠 140~236, NotoSansKR Black 52). **강조어는 진빨강(172,34,28) 둥근 상자 + 크림 글씨**, 상자 앞뒤 여백은 최소로 붙여 ''포위 섬멸당한''처럼 한 단어로 읽히게(11/3 사용자 ''더 세련되게'' — 빨간 글자만 칠하던 방식 대체, 금색 밑줄은 글자와 겹쳐 뺌). 그 위 검은 띠: 왼쪽 연도 배지, 오른쪽 ''역사서클''.'
- id: battle-shorts:85
  date: 11/02
  skill: history-battle-shorts
  line: 85
  kind: 날짜+결정어
  status: 현행후보
  text: '7. **전장 배치는 지형을 읽고 놓는다**(11/2 사용자: ''지형을 잘 이해하고 배치를 넣은 거지?''): DEM(terrarium z12)으로 등고선·골짜기 바닥선(행별 최저점)을 뽑아 능선·골짜기·고개를 확인하고, 기록 문구(동남 8리·依山·西嶺·山北 狹谷·東川梁)를 지형에 하나씩 대응시킨 뒤 배치한다. 대응 근거는 [추정]으로 기획 문서에 적는다. OSM Overpass가 막히면 DEM 골짜기선으로 개울을 그린다.'
- id: battle-shorts:88
  date: 11/02
  skill: history-battle-shorts
  line: 88
  kind: 날짜+결정어
  status: 현행후보
  text: '9. **진형·부대 배치 = ''ㅗ'' 블록**(11/2 사용자 제안, 진형을 선 하나로 그으면 ''굉장히 어색''): 넓은 직사각형 + 앞쪽 짧은 돌기(바라보는 방향). 병종은 **블록 안 작은 도트 아이콘(크림 외곽선)**으로 구분하고 글자·범례는 쓰지 않는다(11/2 사용자 ''보/기 글자는 모르겠다'' → 아이콘으로 확정). 군단 단위 6~9개, 일직선 금지 — 지형을 따라 휘고 앞뒤로 엇갈리게. 방향 전환·분산은 돌기 회전과 블록 사이 틈으로 보여 준다. 기록에 없는 배치·병종 비중은 **군사사 전문가 검수(Agent)**로 합리적 추정을 받고 화면에 ''개념도''. 진법 이름(학익진·육화진 등)·현대 부대 용어·판금 갑옷 금지.'
- id: battle-shorts:134
  date: 11/03
  skill: history-battle-shorts
  line: 134
  kind: 날짜+결정어
  status: 현행후보
  text: '- **문장 중간 쉼 자동 점검**(11/3 사용자 ''전체적으로 다시 확인''): -40dB 0.1초 이상 무음을 찾아 앞 단어에 쉼표·마침표가 없으면 0.07초로 줄인다(4편 7곳: ''버티기는 / 33년 전'', ''요동성에서 / 군량'' 등). 쉼표 자리 0.3초 안팎은 그대로, 0.5초 넘으면 0.24~0.3초로.'
- id: battle-shorts:144
  date: 10/30
  skill: history-battle-shorts
  line: 144
  kind: 날짜+결정어
  status: 현행후보
  text: '- **엔진 비교(10/30)**: MiniMax 느림, ElevenLabs 뭉갬. 사용자는 Harrison 유지.'
- id: battle-shorts:176
  date: 10/19
  skill: history-battle-shorts
  line: 176
  kind: 날짜+결정어
  status: 현행후보
  text: '- **설명란(10/19 사용자 양식, 쇼츠 전체)** = 요약 2문장 → ''※'' 핵심 주석 1개(숫자 범위·결과 내역 등 검수에서 걸린 것) → ''출처: …'' 한 줄 → 고지 줄(개념도·위치설 / 해석·말풍선은 연출 + 원문 / 후대 이름 등) → 해시태그. 깨알 정보 줄은 넣지 않는다.'
- id: channel-concept:6
  date: 10/25
  skill: history-channel-concept
  line: 6
  kind: 날짜+결정어
  status: 현행후보
  text: '# 역사서클 채널 컨셉 (v1.3 · 2026-10-25 · 오프닝 = 줄거리 요약 훅(7-2) · 차차 확정 중)'
- id: channel-concept:9
  date: 10/23
  skill: history-channel-concept
  line: 9
  kind: 날짜+결정어
  status: 현행후보
  text: '> **우선순위(10/23 확정)**: 스킬끼리 충돌하면 **날짜가 붙은 최신 사용자 결정**을 따른다. 날짜가 같거나 없으면 history-channel-concept > history-longform · history-architecture-shorts > history-shorts. 작업 중 낡은 문장을 발견하면 그 문장을 따르지 말고, 사용자에게 알리며 고칠 곳을 제안한다.'
- id: channel-concept:12
  date: 10/10
  skill: history-channel-concept
  line: 12
  kind: 확정표기
  status: 현행후보
  text: '## 0. 작업 관점 — 역할 프롬프트 [확정 10/10 · 관문 10/23]'
- id: channel-concept:13
  date: 10/23
  skill: history-channel-concept
  line: 13
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/23] **롱폼은 3단계 관문**으로 만든다: ① 비트시트 → ② 대본 → ③ 스토리보드. 관문마다 독립 리뷰어 2명(첫 시청자 / 유튜브 디렉터)이 따로 검토하고, 사용자가 편집장으로 고치고 승인한다(대본·스토리보드는 사용자가 직접 고친다). 사학자 리뷰어는 두지 않는다 — 고증은 지키되 영상이 딱딱한 강의가 되는 것을 가장 경계하기 때문. 절차는 history-longform B-0'
- id: channel-concept:47
  date: 10/17
  skill: history-channel-concept
  line: 47
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/17] **건축·도시 시리즈(''도시의 일생'')는 12-1 프롬프트의 세 역할(도시공학자 / 건축사학자 / 유튜브 기획자 겸 영상 디자이너)로 검토한다** — 12-1'
- id: channel-concept:53
  date: 10/07
  skill: history-channel-concept
  line: 53
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/7] **내용의 구성과 영상미를 같이 잡는다.** 이것이 사용자가 재미있어하는 방향이다. 둘 중 하나를 위해 다른 하나를 버리지 않는다'
- id: channel-concept:54
  date: 10/07
  skill: history-channel-concept
  line: 54
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/7] **전투 구간은 영상미를 위해 충분히 둔다.** 없애거나 내레이션으로 덮어 버리지 않는다(4번)'
- id: channel-concept:56
  date: 10/09
  skill: history-channel-concept
  line: 56
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/9] **상대를 바보로 그리지 않는다.** 승자의 우위는 상대의 실수가 아니라, 상대의 상황과 심리를 역이용한 뛰어난 모습으로 보여 준다(5번)'
- id: channel-concept:57
  date: 10/10
  skill: history-channel-concept
  line: 57
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/10] **국제 정세로 전쟁의 이유를 풀고, 한 발 더 들어가 이 전투의 전술적 함의와 "왜?"에 답한다**(2-1)'
- id: channel-concept:58
  date: 10/10
  skill: history-channel-concept
  line: 58
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/10] **기록이 한 줄이어도 역사적 상상력으로 해석한다.** 사용자가 매우 중요하게 여기는 원칙이다. 짧은 기록을 발판으로 조건을 재구성하고 판단을 세우되, 상상임을 밝힌다(5-1)'
- id: channel-concept:59
  date: 10/12
  skill: history-channel-concept
  line: 59
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/12] **수묵화에서 시작한 채널**: 매 편 시그니처 오프닝(수묵화 → 먹 번짐 → 실사)으로 이 정체성을 새긴다(7-2)'
- id: channel-concept:60
  date: 10/17
  skill: history-channel-concept
  line: 60
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/17] **매 편 도트 그림을 하나 이상 넣는다.** 롱폼·쇼츠·건축 시리즈 모두. 깨알 등장으로 채널의 숨은 서명처럼 쓴다(7-3)'
- id: channel-concept:61
  date: 10/17
  skill: history-channel-concept
  line: 61
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/17] **건축·도시 시리즈 = 도시의 일생**: "그 도시는 왜 그 자리에서, 그 모양으로 자랐고, 그 시대 건물은 왜 그렇게 생겼을까?" 1편은 「고구려 수도는 왜 세 번 이사했나」, 서울은 뒤로(12번)'
- id: channel-concept:62
  date: 10/14
  skill: history-channel-concept
  line: 62
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/14] **판단을 따지는 목소리는 사용자의 것이다.** 매 편 판단 분석 구간(2-2)의 초고를 사용자가 쓴다'
- id: channel-concept:63
  date: 10/23
  skill: history-channel-concept
  line: 63
  kind: 확정표기
  status: 보류후보
  text: '- [확정 10/23] **타깃 시청자**: 핵심층 = 45~64세 한국 남성 역사 애호가(10/23 기준 시청자의 84%, 남성 89%, 모바일 87%) / 확장 = 30~40대(롱폼 패키징 3안 중 1안으로 상시 시험) / 해외 = 보류(자동 더빙 한국어→영어는 가능 — 국내 재방문 시청층이 생긴 뒤 다시 검토). 도트·자막 크기·말투·썸네일을 판단할 때 이 정의를 잣대로 쓴다'
- id: channel-concept:68
  date: 10/07
  skill: history-channel-concept
  line: 68
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/7] **한 편 = 결정 하나 = 질문 하나, 답 하나**'
- id: channel-concept:69
  date: 10/25
  skill: history-channel-concept
  line: 69
  kind: 확정표기
  status: 폐기후보
  text: '- [확정 10/25] **편의 첫 화면 = 줄거리 요약 훅**(7-2): 아는 이름 → 약자의 출발 → 결말 한 문장 → ''어떻게'' 질문 → 시그니처 → 제목. 10/23 실험 E2(질문 먼저 → 시그니처 3초 → 제목)는 이것으로 대체. 아래 10/17안은 보류(전투 컷 플래시는 결말 문장의 화면으로 흡수)'
- id: channel-concept:71
  date: 10/07
  skill: history-channel-concept
  line: 71
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/7] 순서와 각 단계에서 **말로** 해야 하는 것:'
- id: channel-concept:73
  date: 10/12
  skill: history-channel-concept
  line: 73
  kind: 확정표기
  status: 현행후보
  text: '- ② "당신이라면?": 선택지를 소리 내어 하나씩 센다("길은 셋이었습니다. 첫째…"). **[확정 10/12] 선택지마다 한 줄**(이득·위험을 한 문장에 압축). 길게 늘이면 늘어진다는 피드백'
- id: channel-concept:74
  date: 10/12
  skill: history-channel-concept
  line: 74
  kind: 확정표기
  status: 현행후보
  text: '- ③ 실제 선택: 무엇을 골랐는지, 왜 그것이었는지. **[확정 10/12] ②와 ③은 한 구간으로 붙인다**(선택지 셈 직후 바로 선택). 이유는 **둘 이내**로 좁힌다(2부: 왕 한 사람 · 때)'
- id: channel-concept:76
  date: 10/14
  skill: history-channel-concept
  line: 76
  kind: 확정표기
  status: 현행후보
  text: '- ⑤ 판단 분석: **[확정 10/14]** 그 선택을 심의 메모 틀(목표 / 제약 / 선택지 / 리스크 / 대가)로 따져 보는 1~2분 구간. 초고는 사용자가 쓴다(2-2)'
- id: channel-concept:79
  date: 10/08
  skill: history-channel-concept
  line: 79
  kind: 날짜+결정어
  status: 현행후보
  text: '- 전술 장면에 들어가기 전에 **전략의 이유를 먼저** 설명한다. 예: 2부는 "왕은 왜 안장을 풀었나" 이전에 "약한 나라가 왜 먼저 쳤나"가 오른다(10/8 사용자 지적)'
- id: channel-concept:82
  date: 10/10
  skill: history-channel-concept
  line: 82
  kind: 확정표기
  status: 현행후보
  text: '### 2-1. 세 겹 질문 [확정 10/10]'
- id: channel-concept:91
  date: 10/10
  skill: history-channel-concept
  line: 91
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/10] 비중: **세계 겹(국제 정세)은 1~2분 안에 자연스럽게 마무리한다.** 깊이는 전장 겹에 쓴다(채널의 차별점). 레퍼런스 영상(11번)은 세계 겹을 잘 설명한다. 우리는 전장 겹에서 "왜?"를 끝까지 판다'
- id: channel-concept:97
  date: 10/14
  skill: history-channel-concept
  line: 97
  kind: 확정표기
  status: 현행후보
  text: '### 2-2. 판단 분석 구간 [확정 10/14 · 화면 확정 10/17(먹 글씨) · 길이는 3부 시청 지속률 확인 후]'
- id: channel-concept:98
  date: 10/14
  skill: history-channel-concept
  line: 98
  kind: 날짜+결정어
  status: 현행후보
  text: '배경(10/14): 사용자가 지금 영상에 약 70점 만족. 진단 — 정체성은 ''판단 해설''인데 영상 안에서 판단을 따지는 분량이 이유 둘·한계 한 줄 수준이고, 해석의 뼈대가 강의에 기대 있어 사용자의 관점이 보이지 않는다. 사용자 결정: 판단 분석을 공식 구간으로 두고, 그 초고는 사용자가 쓴다.'
- id: channel-concept:111
  date: 10/23
  skill: history-channel-concept
  line: 111
  kind: 날짜+결정어
  status: 현행후보
  text: '- **목소리 = 사용자(10/23 실험 E5, 온조 편)**: 이 구간은 Harrison 대신 사용자가 직접 녹음한다(폰 녹음 가능, 약 10분). 정체성 ''판단을 따지는 목소리는 사용자의 것''을 소리로 구현한다. 그 구간의 지속 그래프와 댓글 반응으로 고정 여부를 정한다. 녹음본은 −17 LUFS로 맞추고 잡음만 걷는다(목소리 성질은 바꾸지 않는다)'
- id: channel-concept:120
  date: 10/07
  skill: history-channel-concept
  line: 120
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/7] 원칙: **화면에만 있는 정보는 없다.** 자막, 지도 표시, 카드, 인장에 적힌 것은 모두 소리로도 나온다. 이 원칙은 ''정보''에 대한 것이지 말이 쉬지 않아야 한다는 뜻이 아니다'
- id: channel-concept:132
  date: 10/07
  skill: history-channel-concept
  line: 132
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/7] 전투 구간은 충분히 두고, 영상미를 살린다'
- id: channel-concept:135
  date: 10/12
  skill: history-channel-concept
  line: 135
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/12] **시각·청각의 대비(완급)**: 해설 구간(지도·회의)은 조용하고 정돈되게, 몰입 구간(행군·진창·돌격)은 현장음(발굽·진흙·숨소리·함성·바람)을 앞에 둔다. 효과음은 Higgsfield로 생성(history-longform F). 실제 밸런스는 사용자가 듣고 판단'
- id: channel-concept:136
  date: 10/07
  skill: history-channel-concept
  line: 136
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/7~8] 1부 전투는 처음이라 어색한 부분과 미학적으로 부족한 부분이 있다(사용자 평가). 2부부터 정지 이미지 콘티에서 구도와 순서를 먼저 잡아 개선한다'
- id: channel-concept:143
  date: 10/10
  skill: history-channel-concept
  line: 143
  kind: 날짜+결정어
  status: 현행후보
  text: '- 참고(10/10 사용자 레퍼런스, 오장원 전투 영상 스틸): 역광·옅은 안개·저채도 청회색, 앞쪽 깃발 하나와 뒤로 넓은 진영을 둔 깊은 구도, 큰 동작 없이 깃발·연기·인물의 작은 움직임. → 정지 그림을 시작 프레임으로 만든 뒤 영상 모델로 작은 움직임만 입힌다(2부에서 Kling 3.0 pro로 적용)'
- id: channel-concept:147
  date: 10/09
  skill: history-channel-concept
  line: 147
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/9] **상대는 합리적이다. 승리는 그 합리성을 역이용한 데서 나온다.** 진 쪽을 "바보여서 당했다"로 그리지 않는다. 상대의 계산을 먼저 그럴 만하게 보여 주고, 이긴 쪽이 그 계산과 상황·심리를 어떻게 읽고 이용했는지를 보여 준다'
- id: channel-concept:150
  date: 10/08
  skill: history-channel-concept
  line: 150
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/8] **신이한 기사는 현대식으로 재해석한다.** 내레이션은 "기록은 이렇게 전합니다" → "오늘의 눈으로 읽으면" 두 단계로 말해 기록과 해석이 섞이지 않게 한다. 가능하면 그 기사가 이야기 안에서 하는 일(예: 원정의 약점인 군량·무기·길을 메움)로 묶는다. 길어지면 압축한다(2부 v3: 한 문단)'
- id: channel-concept:151
  date: 10/08
  skill: history-channel-concept
  line: 151
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/8] **기록이 이유를 말하지 않으면** 기록의 앞뒤 순서와 해석으로 세운다. 해석·추정·추측을 대본과 설명란에 구분해 적는다'
- id: channel-concept:152
  date: 10/10
  skill: history-channel-concept
  line: 152
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/10] **국제 정세는 ''틈''으로 말한다.** 주변 정세가 전쟁을 일으켰다고 단정하지 않는다. 그 정세가 어떤 기회나 압박을 만들었는지까지 말하고, 그 틈을 왜 그 방식으로 이용했는지는 나라·전장 겹에서 답한다'
- id: channel-concept:155
  date: 10/10
  skill: history-channel-concept
  line: 155
  kind: 날짜+결정어
  status: 현행후보
  text: '### 5-1. 역사적 상상력 — 한 줄의 기록에서 판단을 세우는 법 [원칙 확정 10/10, 절차는 제안]'
- id: channel-concept:156
  date: 10/10
  skill: history-channel-concept
  line: 156
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/10] 기록이 짧다는 이유로 주제를 버리지 않는다. 사용자와 Claude가 한 줄의 기록을 발판으로 역사적 상상력을 발휘해 해석한다. 이것이 채널의 중요한 무기다'
- id: channel-concept:200
  date: 10/07
  skill: history-channel-concept
  line: 200
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/7] 지도를 보면 더 풍성하고 상상력 있게 이해되지만, 못 보는 사람도 이해할 수 있어야 한다'
- id: channel-concept:204
  date: 10/12
  skill: history-channel-concept
  line: 204
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/12] **세력 색을 모든 전투 컷에서 지킨다**: 고구려 붉은 옷·붉은 깃발 / 부여 흰 옷·짙은 모피. 돌격 컷은 진행 방향 앞에 적의 색만, 뒤에 아군의 색만 둔다(색이 섞이면 아군을 치는 것처럼 보인다)'
- id: channel-concept:205
  date: 10/12
  skill: history-channel-concept
  line: 205
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/12] **고증이 몰입을 지킨다**: 지형·계절이 만드는 물리(진창 깊이 등)와 규모(진영 크기)가 어긋나면 시청자 몰입이 깨진다. 기록이 정도를 말하지 않으면 ''그 상황에서 상대가 진군을 택할 만한 수준''으로 그린다'
- id: channel-concept:207
  date: 10/10
  skill: history-channel-concept
  line: 207
  kind: 확정표기
  status: 현행후보
  text: '### 7-1. 전략·전술 지도 체계 [확정 10/10, 색·국경 v3 확정 10/12 — 사용자가 준 지도 레퍼런스 기준]'
- id: channel-concept:219
  date: 10/12
  skill: history-channel-concept
  line: 219
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/12, 지도 v3] **국경은 지형을 따른다**: 산줄기(분수령)·큰 강을 경계로 자연스럽게 맞물린다. 직선·다각형 국경 금지. 세력 면은 **진하고 채도를 눌러** 나라마다 확실히 다른 색, 아래 지형 음영이 비친다'
- id: channel-concept:220
  date: 10/12
  skill: history-channel-concept
  line: 220
  kind: 확정표기
  status: 폐기후보
  text: '- [확정 10/12] 세력 색(지도 v3): 고구려 = 짙은 적갈 (96,34,29) / 부여 = 짙은 남회 (42,58,86) / 신(新)·낙랑 = 짙은 올리브 (70,74,22) / 흉노·선비·옥저·삼한은 history-longform 지도 키트의 표. 백제 = **황금색 계열**(10/21~22, 옛 기록의 금칠 근거 — 청색에서 변경. RGB는 BC 1세기 프리셋 제작 때 정함, production-standards 2절). 신라·가야는 처음 나오는 편에서 정하고 시리즈 안에서 바꾸지 않는다(10/10의 ''부여 = 회백·흑'', ''중원 = 남청'' 안은 v3로 대체)'
- id: channel-concept:221
  date: 10/12
  skill: history-channel-concept
  line: 221
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/12] 영역은 그 시점의 기록으로 그린다: 1세기 초 고구려는 동해에 닿지 않는다(옥저가 사이에, 동옥저 복속은 56년). 영역 근거는 대본 표에 적는다'
- id: channel-concept:222
  date: 10/12
  skill: history-channel-concept
  line: 222
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/12] 전략도의 보조 라벨은 그 편의 판단에 필요한 것만(2부: 선비·오환 / 낙랑 / 삼한)'
- id: channel-concept:223
  date: 10/12
  skill: history-channel-concept
  line: 223
  kind: 확정표기
  status: 폐기후보
  text: '- [확정 10/12] 쇼츠도 같은 지도 v3(세로 판)를 쓴다. 이전 AI 재채색 한반도 지도는 도시 위치·이동 경로만 보일 때의 대체용'
- id: channel-concept:228
  date: 10/12
  skill: history-channel-concept
  line: 228
  kind: 확정표기
  status: 현행후보
  text: '### 7-2. 시그니처 오프닝 [확정 10/12]'
- id: channel-concept:231
  date: 10/12
  skill: history-channel-concept
  line: 231
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/12] **쇼츠는 3초 축약판**: 45초 신작의 첫 장면을 수묵 스틸 → 먹 번짐 → 같은 구도의 실사 움직이는 컷으로(제목·첫 내레이션은 0초부터). 구현은 history-shorts D-1·F-5'
- id: channel-concept:233
  date: 10/25
  skill: history-channel-concept
  line: 233
  kind: 확정표기
  status: 현행후보
  text: '- **[확정 10/25] 오프닝 = 줄거리 요약 훅(롱폼·쇼츠 공통, 배경지식 0·초등학생 기준)** — 질문만 먼저 던지면 원인을 모르는 시청자는 ''어쩌라고?''가 된다(온조 편 v1.4, 배경지식 없는 시청자 피드백). 질문 앞에 줄거리를 먼저 들려준다'
- id: channel-concept:240
  date: 10/17
  skill: history-channel-concept
  line: 240
  kind: 확정표기
  status: 현행후보
  text: '### 7-3. 도트 그림 [확정 10/17]'
- id: channel-concept:241
  date: 10/23
  skill: history-channel-concept
  line: 241
  kind: 확정표기
  status: 폐기후보
  text: '- **매 편 한 곳 이상** 넣는다. 롱폼·쇼츠(재편집·신작)·건축 시리즈 모두 해당. **[10/23] 금지 구간: 죽음·비극 장면, 판단 분석 구간**(톤을 깨지 않게)(10/4의 ''선택 사항, 기본은 넣지 않음'' 규칙은 10/17 결정으로 폐기 — 10/23 재확인)'
- id: channel-concept:249
  date: 10/10
  skill: history-channel-concept
  line: 249
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/10] **롱폼은 편당 약 10분, 2주에 1편**(9분 안팎도 OK, 10/12)'
- id: channel-concept:250
  date: 10/10
  skill: history-channel-concept
  line: 250
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/10] **편 수 = 결정 수. 기본은 한 전투 1편.** 기록(또는 기록 한 줄 + 5-1의 상상)으로 진짜 대안이 있는 결정을 둘 이상 세울 수 있을 때만 2부작·3부작으로 늘린다. 3부작은 시즌의 절정처럼 결정이 셋 이상 쌓인 전쟁에만 쓴다(대무신왕 = 매복 / 선제공격 / 퇴각)'
- id: channel-concept:252
  date: 10/24
  skill: history-channel-concept
  line: 252
  kind: 확정표기
  status: 현행후보
  text: '- [10/24] 2주 1편 유지. 온조 편의 관문별 실측 시간(longform B-0 ''제작 시간 기록'')으로 재판단한다'
- id: channel-concept:265
  date: 10/12
  skill: history-channel-concept
  line: 265
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/12] **쇼츠는 두 형식 병행**: 롱폼마다 재편집 하이라이트 3~5편(롱폼으로 데려가는 입구) + 롱폼에 없는 곁가지는 45초 신작. 신작 그림체는 청록산수 유지, 나라 영역 지도는 v3로 통일. 구현은 history-shorts(A-0, M)'
- id: channel-concept:267
  date: 10/13
  skill: history-channel-concept
  line: 267
  kind: 확정표기
  status: 보류후보
  text: '- [확정 10/13] 건축·도시 시리즈는 우선 **쇼츠 45초**로 시작한다(history-architecture-shorts). 롱폼 확장은 반응을 보고 정한다 [제안]. 도시의 일생 1편은 약 58초(10/17)'
- id: channel-concept:269
  date: 10/10
  skill: history-channel-concept
  line: 269
  kind: 확정표기
  status: 현행후보
  text: '### 8-1. 시즌 구조 — 가닥을 쌓다가 폭발시킨다 [확정 10/10]'
- id: channel-concept:282
  date: 10/19
  skill: history-channel-concept
  line: 282
  kind: 날짜+결정어
  status: 현행후보
  text: '| 백제 | 온조 (건국기) | 1편 — 다음 롱폼(10/19 결정) | 마한 아래의 작은 나라가 어떻게 버텼나(10/20 프레임: 한강을 ''완충지''로 받은 이주민) |'
- id: channel-concept:295
  date: 10/17
  skill: history-channel-concept
  line: 295
  kind: 날짜+결정어
  status: 현행후보
  text: '- 판단 분석 구간(2-2)의 길이·판정 문구(화면은 10/17 먹 글씨로 확정, 길이는 시청 지속률 확인 후)'
- id: channel-concept:298
  date: 10/12
  skill: history-channel-concept
  line: 298
  kind: 날짜+결정어
  status: 현행후보
  text: '- 쇼츠의 세부: 재편집 편 제목에 시리즈명을 붙일지, 신작 곁가지 후보 목록(쇼츠 두 형식·시그니처 3초·지도 v3는 10/12 확정)'
- id: channel-concept:303
  date: 10/23
  skill: history-channel-concept
  line: 303
  kind: 날짜+결정어
  status: 현행후보
  text: '- 영상 규칙 감축(10/23 결정): longform E-1·E-2·E-5·E-6·standards 1절의 컷 규칙을 ''컷 점검표 8항목'' 하나로 합친다 — 초안은 온조 스토리보드에서 먼저 쓰고, 스킬 수정은 5라운드 구조 개편 때'
- id: channel-concept:309
  date: 10/07
  skill: history-channel-concept
  line: 309
  kind: 변경이력표
  status: 현행후보
  text: '| 10/7 | 정체성 한 문장 "그 판단은 왜 그랬을까?"를 스킬과 영상 제작의 기본 틀로 삼는다. 장르는 역사/전략 시네마틱. 컨셉은 차차 확정한다 |'
- id: channel-concept:310
  date: 10/07
  skill: history-channel-concept
  line: 310
  kind: 변경이력표
  status: 현행후보
  text: '| 10/7 | 편 구성 공식(딜레마 → 당신이라면? → 실제 선택 → 결과 → 남긴 것)으로 간다 |'
- id: channel-concept:311
  date: 10/07
  skill: history-channel-concept
  line: 311
  kind: 변경이력표
  status: 현행후보
  text: '| 10/7 | 라디오처럼 영상을 안 보고 틀어만 둬도 이해되게 만든다. 지도는 이해를 풍성하게 하는 보강이고, 내용은 소리만으로 알차야 한다 |'
- id: channel-concept:312
  date: 10/07
  skill: history-channel-concept
  line: 312
  kind: 변경이력표
  status: 현행후보
  text: '| 10/7 | 전투 구간은 없애지 않고 영상미를 위해 충분히 둔다. 내용의 구성과 영상미를 같이 잡는 것이 사용자가 재미있어하는 방향. 레퍼런스: 〈란〉(1985) 소개 글 |'
- id: channel-concept:313
  date: 10/08
  skill: history-channel-concept
  line: 313
  kind: 변경이력표
  status: 현행후보
  text: '| 10/8 | 1부 전투는 개선할 부분이 많다(어색한 부분, 미학). 1부 수정보다 2부 기획을 먼저 한다 |'
- id: channel-concept:314
  date: 10/08
  skill: history-channel-concept
  line: 314
  kind: 변경이력표
  status: 현행후보
  text: '| 10/8 | 2부 중심 질문은 "약한 나라가 왜 먼저 쳤나". 어떤 시기에 어떤 이유로 먼저 쳤고, 왕을 먼저 죽이면 이긴다는 판단이었음을 이해하게 한다. 신이한 기사는 현대식으로 재해석한다. 기획안은 Claude Docs 문서의 ''2부 기획안'' 탭 |'
- id: channel-concept:315
  date: 10/09
  skill: history-channel-concept
  line: 315
  kind: 변경이력표
  status: 현행후보
  text: '| 10/9 | 상대를 바보로 그리지 않는다. 상대의 상황과 심리를 역이용한 승자의 뛰어난 모습을 보여 준다 |'
- id: channel-concept:316
  date: 10/10
  skill: history-channel-concept
  line: 316
  kind: 변경이력표
  status: 현행후보
  text: '| 10/10 | 국제 정세로 전쟁의 이유를 설명하고, 한 발 더 들어가 전투의 전술적 함의와 "왜?"에 답한다(세 겹 질문). 작업은 유튜브 기획자·영상 디자이너 두 역할로 검토한다. 전략·전술 지도는 사용자가 준 지도 레퍼런스의 문법을 따른다 |'
- id: channel-concept:317
  date: 10/10
  skill: history-channel-concept
  line: 317
  kind: 변경이력표
  status: 현행후보
  text: '| 10/10 | 롱폼 10분 유지, 2주에 1편. 국제 정세 설명은 1~2분 안에 자연스럽게. 왕의 죽음은 채널의 핵심 축이 아니다 |'
- id: channel-concept:318
  date: 10/10
  skill: history-channel-concept
  line: 318
  kind: 변경이력표
  status: 현행후보
  text: '| 10/10 | 큰 틀은 시대순. 나라별 가닥(고구려·백제, 이후 신라·가야)을 쌓다가 두 나라가 부딪히는 전쟁(예: 근초고왕 시기)에서 폭발시킨다 |'
- id: channel-concept:319
  date: 10/10
  skill: history-channel-concept
  line: 319
  kind: 변경이력표
  status: 현행후보
  text: '| 10/10 | 편 수 = 결정 수. 기본은 한 전투 1편, 결정이 여럿일 때만 2·3부작 |'
- id: channel-concept:320
  date: 10/10
  skill: history-channel-concept
  line: 320
  kind: 변경이력표
  status: 현행후보
  text: '| 10/10 | 기록이 한 줄이어도 역사적 상상력으로 해석한다(사용자가 매우 중요하게 여김). 상상은 상상이라고 밝힌다 |'
- id: channel-concept:321
  date: 10/11
  skill: history-channel-concept
  line: 321
  kind: 변경이력표
  status: 현행후보
  text: '| 10/11 | 실사 컷 영상 모델 = Kling 3.0 pro(비교 시험으로 확정) |'
- id: channel-concept:322
  date: 10/12
  skill: history-channel-concept
  line: 322
  kind: 변경이력표
  status: 현행후보
  text: '| 10/12 | 지도 v3: 국경은 지형(분수령) 기준, 세력 색은 진한 저채도로 확실히 구분(Min Maps 예시). 고구려는 동해에 닿지 않음. 전략 라벨 3개 유지 |'
- id: channel-concept:323
  date: 10/12
  skill: history-channel-concept
  line: 323
  kind: 변경이력표
  status: 현행후보
  text: '| 10/12 | 시그니처 오프닝(수묵화 → 먹 번짐 → 실사)을 채널 고정 영상미로 삼는다(7-2) |'
- id: channel-concept:324
  date: 10/12
  skill: history-channel-concept
  line: 324
  kind: 변경이력표
  status: 현행후보
  text: '| 10/12 | 역순 훅: 콜드 오픈(전투 10초 → 먹으로 되감기) → 시그니처 → 질문 → 제목 |'
- id: channel-concept:325
  date: 10/12
  skill: history-channel-concept
  line: 325
  kind: 변경이력표
  status: 현행후보
  text: '| 10/12 | ''당신이라면''과 ''실제 선택''을 한 구간으로. 선택지는 한 줄씩, 이유는 둘 이내. 길이는 9분 안팎도 OK |'
- id: channel-concept:326
  date: 10/12
  skill: history-channel-concept
  line: 326
  kind: 변경이력표
  status: 현행후보
  text: '| 10/12 | 몰입 구간에 현장음, 해설 구간은 정돈 — 시각·청각 대비. 전투 컷 세력 색 엄수, 고증 어긋남(진창 깊이·진영 규모)은 몰입을 깨는 결함으로 본다 |'
- id: channel-concept:327
  date: 10/12
  skill: history-channel-concept
  line: 327
  kind: 변경이력표
  status: 현행후보
  text: '| 10/12 | 쇼츠: 롱폼 재편집 3~5편 + 곁가지 45초 신작 병행. 신작 그림체는 청록산수 유지, 시그니처는 3초 축약판, 지도는 v3로 통일(history-shorts v8.0) |'
- id: channel-concept:328
  date: 10/13
  skill: history-channel-concept
  line: 328
  kind: 변경이력표
  status: 현행후보
  text: '| 10/13 | 건축·도시 시리즈 신설(역사서클 안). 여러 시대·나라, 실사 복원 + 코드 도해, 양식 반·개발 논리 반. 역할 3(건축·도시 전문가) 추가. 쇼츠부터 시작(12번, history-architecture-shorts) |'
- id: channel-concept:329
  date: 10/14
  skill: history-channel-concept
  line: 329
  kind: 변경이력표
  status: 현행후보
  text: '| 10/14 | 롱폼에 **판단 분석 구간**(1~2분, 심의 메모 5칸: 목표/제약/선택지/리스크/대가)을 공식 단계로 둔다. 이 구간에서는 내레이터가 [해석]으로 판단을 평가할 수 있다. **초고는 사용자가 쓰고 Claude는 고증·문장만 다듬는다**(2-2). 3부부터 적용 |'
- id: channel-concept:330
  date: 10/17
  skill: history-channel-concept
  line: 330
  kind: 변경이력표
  status: 보류후보
  text: '| 10/17 | 건축·도시 시리즈의 주인공을 **도시**로 재정의(''도시의 일생''). 레퍼런스: 베이징 블록 성장 타임랩스. 프롬프트 = 도시공학자·건축사학자·기획자 세 역할(12-1). 서울은 문법을 다듬은 뒤, 성곽 롱폼은 보류 |'
- id: channel-concept:331
  date: 10/17
  skill: history-channel-concept
  line: 331
  kind: 변경이력표
  status: 현행후보
  text: '| 10/17 | 도시의 일생 1편 = 「고구려 수도는 왜 세 번 이사했나」(졸본 → 국내 → 평양 → 장안성, 평지성 둘레 약 0.9 → 2.7 → 23km). 졸본 단독 편은 자료가 적어 버림. 약 58초, 해석을 적극 활용, 평양 1기 왕궁은 ''안학궁''으로 말함(논쟁은 설명란), 개발 논리 비유(''집과 대피소를 한 단지에 모은 복합 개발'') 대본에 넣음 |'
- id: channel-concept:332
  date: 10/17
  skill: history-channel-concept
  line: 332
  kind: 변경이력표
  status: 현행후보
  text: '| 10/17 | **매 편 도트 그림을 한 곳 이상 넣는다**(7-3). 롱폼·쇼츠·건축 시리즈 공통 |'
- id: channel-concept:333
  date: 10/18
  skill: history-channel-concept
  line: 333
  kind: 변경이력표
  status: 폐기후보
  text: '| 10/18 | 건축 ''도시의 일생'' 1편(수도 세 번 이사) 중단 → ''그 시절 고구려'' 틀로 재출발(history-architecture-shorts 11번) |'
- id: channel-concept:335
  date: 10/23
  skill: history-channel-concept
  line: 335
