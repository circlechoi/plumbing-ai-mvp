  status: 현행후보
  text: '- **모델 확정(10/14 A/B)**: **Kling 3.0 pro + 전투 문법 조각 편집**(사용자 "훨씬 괜찮다"). 시험: 3부 야간 탈출 4컷 — 시작 이미지 job 부감 야영지 57167795 · 허수아비 보초 bdd80650 · 대무신왕 얼굴 7cde5316(시트 5f2baacc) · 갈대 행렬 8891a53c → Kling 영상 e5907220 · 79c41f98 · 1f18105c · fa273e22(3부 야간 탈출 시퀀스에 재사용 가능). 비교 영상 B + `4f926bc2-2c3e-4325-8d01-6d5fa6037927.mp4`. Seedance 2.5는 쓰지 않는다(5초 1080p 80 크레딧, 모델 차이보다 편집 차이가 컸다)'
