  status: 폐기후보
  text: 'v8.0 변경(2026-10-12, 사용자 결정 — 롱폼 스킬 v2.0과 채널 컨셉 v0.6에서 쇼츠에 쓸 내용을 옮김): ① **두 형식 병행** — 롱폼마다 재편집 하이라이트 3~5편(M, 10/7 대무신왕 1부 5편 방식) + 롱폼에 없는 곁가지는 45초 신작(B~L) ② **채널 컨셉 우선** — 기획·대본 전에 `history-channel-concept`을 먼저 읽는다: ''그 판단은 왜 그랬을까?'', 상대를 바보로 그리지 않기, 라디오 기준, 신이한 기사의 현대식 재해석, 역사적 상상력(A-0) ③ **신작 그림체는 청록산수 유지**(사용자 선택). 의상 색·피아 색 구분·진창·진영 규모는 롱폼 기준(E) ④ **시그니처 3초 축약판** — 신작 첫 장면 = 수묵 스틸 → 먹 번짐 → 같은 구도의 움직이는 실사 컷, 제목은 처음부터(D-1, F-5) ⑤ **지도 v3로 통일** — 지형 음영 + 지형(분수령) 국경 + 진한 저채도 세력 색, 1세기 초 고구려는 동해에 닿지 않음(L-0). AI 재채색 지도(korea_full)는 도시 위치·이동 경로만 보일 때의 대체용 ⑥ **내레이션 작법** — 롱폼 D-1의 ''설명하듯 잇기''를 45초에 맞게(D-2) ⑦ **음향** — 효과음 mirelo 생성 가능, 음량은 RMS 기준, BGM은 사용자 Suno 곡(F-6) ⑧ **작업 규칙** — 매 보고에 ''움직임을 볼 수 없고 소리를 들을 수 없음'' 명시(A-0), 롱폼에서 겪은 sandbox 규칙(G), 한글 고유어 오타 확인(H) ⑨ 고증 태그를 롱폼과 맞춤([상상]·[연출] 추가, C-2).'
- id: shorts:17
