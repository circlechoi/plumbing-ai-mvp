  kind: 날짜+결정어
  status: 현행후보
  text: '- **판단 분석 구간 = 사용자 직접 녹음(10/23 실험 E5, 온조 편)**: 사용자가 폰으로 녹음한 파일을 받아 잡음 제거(afftdn 약하게) + −17 LUFS 정규화만 한다. 대본 문단 단위로 파일을 나누고 받아쓰기로 시각을 잡는 절차는 다른 문단과 같다. 그 외 구간은 Harrison'
- id: longform:281
  date: 10/12
  skill: history-longform
  line: 281
  kind: 날짜+결정어
  status: 현행후보
  text: '- **효과음은 mirelo로 만든다(10/12, 사용자 선택)**. 배경음악은 만들지 않는다 — 사용자가 Suno로 준비(K). 2부 효과음 job: melee fefc84ca · horsemud 909de03f · breath 296fe193 · march 5c514ec6 · wind 13f7ed42 · camp b50eaf4a · inkdrop 3dfbeeea · charge cdf1a681 · siege d8e7867d (sword beec1205는 거의 무음, 불채택). 3부 추가: arrows 8dd00c93 · splash 217dbd8e · stakes 1c22ecfc · mudgallop ecd1ad86, 나머지는 `~/sfx3/`. 생성 뒤 평균 음량을 재서 무음·클리핑을 거른다'
- id: longform:320
  date: 10/19
  skill: history-longform
  line: 320
  kind: 날짜+결정어
  status: 현행후보
  text: '- 설명란: 한 줄 요약 → 해석과 이설(전술 해석은 임용한 교수 강의, 칭호설, 초기 기록 연대 문제, 회의 대사는 연출, 복기·이유 문장은 해석, 2부 진창 깊이는 해석, 3부부터 판단 분석 구간은 제작자 해석, 3부 ''들킬 뻔한 순간''은 연출) → 의상·깃발·지도 고지(깃발 문양은 후대 양식, 지도 국경은 지형 기준 개념도, 위치 이견 — 갈사국 위치 여러 설) → 출처(『삼국사기』 고구려본기 · 『삼국지』 위서 동이전 · 『한서』 왕망전 · 임용한 올댓히스토리 강의 · 우리역사넷 · 한국민족문화대백과사전) → 음악(Suno) · 효과음(AI 생성) → "영상 속 인물과 장면은 AI로 재현한 것이며 실제 복식·지형과 다를 수 있습니다." → #고구려 #대무신왕 #부여 #한국사 #역사서클 (깨알 정보 줄은 쓰지 않는다 — 10/19 사용자 양식 취지, 10/23 롱폼에도 적용)'
- id: longform:321
  date: 10/23
  skill: history-longform
  line: 321
  kind: 날짜+결정어
  status: 현행후보
  text: '- **패키징(10/23 확정)**: 롱폼마다 Studio ''테스트 및 비교''로 **제목·썸네일 3안 필수** — ① 판단 질문형("약한 나라는 왜 먼저 쳤나") ② 결과 반전형("적의 왕을 베고도 굶어 죽을 뻔한 고구려") ③ 30~40대형(인물 클로즈업·짧은 문구·밝은 대비). 기본 방향은 정하지 않고 테스트 결과로 쌓는다. 승자는 유튜브가 시청 시간으로 정하며, 쇼츠는 대상 아님·컴퓨터 Studio에서만(YouTube 고객센터 16391400). 결과는 성과 장부에 적는다'
