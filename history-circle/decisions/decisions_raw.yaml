  kind: 날짜+결정어
  status: 현행후보
  text: '- **뻔함 필터(v7.5, 2026-10-01 사용자 판단 "너무 뻔한 주제")**: 교과서·드라마로 널리 알려진 이야기(예: ⑥ 부러진 칼)는 피드에서 넘겨진다. 후보마다 ① 의외의 주인공·원인(사람이 아닌 눈·돼지, 어린아이) ② 충격적 결정 ③ 처음 듣는 기록 중 하나 이상을 갖췄는지 표시하고, 없으면 같은 사건을 다른 질문으로 비튼다(예: ''대소의 인질 요구'' → ''부여는 왜 고구려를 바로 없애지 못했을까?''). 제목·첫 문장은 인물을 아는 사람만 궁금한 "왜 ~했을까?"보다 **의외의 사실 + 물음**으로.'
- id: shorts:84
  date: 10/03
  skill: history-shorts
  line: 84
  kind: 날짜+결정어
  status: 현행후보
  text: '- ⑧ 부여 왕의 협박에 맞선 게 6살 왕자라고?(유리왕 28년, 기록상 AD 9) — **완료**(43.7초, 2026-10-03, v7.5 첫 적용: 9장면, 337자 42.9초 = 초당 7.9자, 지도는 국내성 표지). 무휼은 서기 4년생(한국민족문화대백과 ''대무신왕'') → 세는나이 6세, 원문 ''年尙幼少''. 알을 쌓는 비유(今有累卵於此), 부여 노파의 풀이. 결말에서 ''4년 뒤 대소의 군대'' 예고. 사용자 반응 "좋았어". **지표**: 게시 약 6시간 유효 조회 636, 계속 시청 62.6% / 이탈 37.4%, 평균 시청 0:48(초기 수치 — ⑦보다 반복 시청이 적음, 24시간 뒤 재확인)'
- id: shorts:85
  date: 10/04
  skill: history-shorts
  line: 85
  kind: 날짜+결정어
  status: 현행후보
  text: '- ⑨ 활 하나 꺾었다고 태자가 죽어야 했다고?(해명태자, 기록상 AD 8~9) — **완료**(45.16초, 2026-10-04, v7.6 첫 적용: 8장면, 약 300자 44.4초 = 초당 6.7자). 사용자 요청으로 ''사건''이 아니라 **외교 문제**(굽힐 것인가 맞설 것인가)로 구성. 근거: 한국민족문화대백과 ''해명''(책봉 AD 4, 졸본 잔류, 황룡국 왕의 활을 꺾음, 유리왕이 황룡국에 죽여 달라고 청함, 황룡국 왕은 죽이지 못함, AD 9 칼을 내려 자결 명령, 여원 동쪽 들에서 창에 찔려 죽음, 창원). 나이 21세·대사는 위키백과 인용(원문 미확인, 생몰년 BC 12~AD 9와는 일치). ''복종하라는 활''·''외교 마찰''은 [해석](나무위키 각주 수준 — 설명란 고지). 황룡국 위치는 [미상] → 졸본 서쪽에 임의 색칠 영역. 6번 장면에 도트 기마 무사. 끝은 시청자 질문("여러분이 왕이었다면…"), 다음 편 예고는 고정 댓글. 크레딧 약 21.6(첫 장면 후보 8장 포함)'
- id: shorts:86
