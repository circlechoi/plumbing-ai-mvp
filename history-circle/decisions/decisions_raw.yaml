  status: 폐기후보
  text: 'v7.6 변경(2026-10-04, ⑨ 제작 중 사용자 결정): ① **제목 서체 = 본고딕 Black**(검은고딕은 획 많은 글자가 가늘게 보임, D-3) ② **설명란 표준 양식 + ''깨알 정보'' 한 줄**(J, 깨알 정보는 선택) ③ **[해석] 태그** — 사료에 없는 의미 부여는 ''~듯/~로 읽힌다''로만(C-2) ④ **위치 미상인 나라는 점 대신 색칠 영역 + ''?''**(L-2) ⑤ **깨알 도트(선택 사항 — 기본은 넣지 않음, v7.7 · v8.1에서 폐지 — 도트 필수)** — 자체 제작 도트 스프라이트가 한 장면을 지나감(sprite.py, G-4) ⑥ **첫 장면 = 전경 액션 클로즈업, 구도가 다른 후보 2~3장을 비교해 고름**(E, F) ⑦ **끝맺음 대안: 시청자에게 묻는 질문**(D-1) ⑧ 대본은 사용자가 직접 고쳐 쓰는 일이 많다 → 사용자 문장을 살리고 고증·비문만 고친다(B) ⑨ 렌더 메모리 초과 방지(48프레임 묶음)와 업로드 전 파일 검증(G).'
