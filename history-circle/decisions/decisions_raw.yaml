  status: 현행후보
  text: '> **우선순위(10/23 확정)**: 스킬끼리 충돌하면 **날짜가 붙은 최신 사용자 결정**을 따른다. 날짜가 같거나 없으면 history-channel-concept > history-longform · history-architecture-shorts > history-shorts. 작업 중 낡은 문장을 발견하면 그 문장을 따르지 말고, 사용자에게 알리며 고칠 곳을 제안한다.'
- id: shorts:10
