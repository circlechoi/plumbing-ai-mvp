  status: 현행후보
  text: 'v7 변경(2026-09-28, 사용자 요청): ① 지도 = 코드 밑그림(ctl.py) → gpt_image_2_5가 그림체만 다시 칠함 → 해안선 자동 검수(qa.py) → 표지·경로·글자는 코드(anim.py + render.py). **사용자가 승인한 한반도 지도의 그림체를 채널 표준으로 고정**(L-5 라이브러리) ② 이미지 STYLE을 무채색 → 청록산수 채색으로, 해상도 1k → 2k ③ 지도 라벨을 원본 좌표계에 그려 줌 중 글자 떨림 제거 ④ 자막을 실제 잉크 폭 기준으로 중앙 정렬(『』·[ ] 쏠림 해결) ⑤ 내레이션을 흥나는 이야기꾼 문체로(D-2) ⑥ 렌더 그레이딩: 채도↑·대비↑·따뜻한 하이라이트/청록 그림자.'
