  line: 935
  kind: 날짜+결정어
  status: 현행후보
  text: '- 제목: `{질문} | {시리즈명} {편 번호} #shorts` (≤40자). **업로드 제목에는 시리즈명·편 번호를 유지**(사용자 결정 2026-09-29) — 영상 화면에서만 시리즈 표시를 뺀다. 예: `고구려, 주몽 혼자 세웠을까? | 고구려 ⑤ #shorts`, `부여 왕의 협박에 맞선 게 6살 왕자라고? | 고구려 ⑧ #shorts`, `활 하나 꺾었다고 태자가 죽어야 했다고? | 고구려 ⑨ #shorts`. 제목은 첫 장면 그림과 맞춘다(⑨: 첫 장면이 활을 꺾는 그림으로 바뀌자 제목도 ''칼''에서 ''활''로). 제목은 후보 3~4개를 표로 제시하고 사용자가 고른다(⑧에서 사용자가 직접 말투를 고침 — 놀라는 구어체 "~라고?" 선호, 처음 보는 사람이 모르는 인물명(대소왕)보다 ''부여 왕'')'
