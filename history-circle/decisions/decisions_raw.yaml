  kind: 날짜+결정어
  status: 폐기후보
  text: 'v8.1 변경(2026-10-23, 스킬 정비 — 사용자 답): ① 충돌은 최신 날짜 결정 우선(위 문단) ② **도트 매 편 1곳 필수**(concept 7-3, 10/17 — 아래 v7.6⑤·v7.7① 폐지) ③ 내레이션 기본 = ''합니다''체 + ''~죠/~요'' 대화체, 평서 ''~다.'' 0회(D-2) ④ 설명란 = 10/19 사용자 양식으로 쇼츠 전체 통일, 깨알 정보 줄 삭제(J) ⑤ 재편집 화면의 제목·연도 배지·워터마크를 신작 표준과 통일, 자막은 1줄 방식 유지(M-4) ⑥ Kling `sound: "off"` 문자열(F-4) ⑦ A ''이야기 사슬''은 곁가지 후보 발굴 도구(채널 구조는 concept 8-1) ⑧ 진행 상황 갱신(A-4) ⑨ 지도 핵심 표지 = 붉은 원 markers, 인장은 이름표에만(L-0) ⑩ 태그 = concept 5-1 마스터 표(C-2)'
- id: shorts:15
