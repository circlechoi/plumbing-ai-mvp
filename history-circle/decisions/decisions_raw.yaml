  text: '- [추정] 등급은 사용자 결정(2026-09-27)으로 추가. 예: 부아악 = 북한산 인수봉 부근(한국사데이터베이스 주석).'
- id: shorts:145
  date: 09/27
  skill: history-shorts
  line: 145
  kind: 날짜+결정어
  status: 현행후보
  text: '- 사료 간 기록·학설이 갈리면 **기본값은 ''주류 설 중심으로 영상 진행, 나머지 설은 설명란''**(사용자 결정, 2026-09-27). 단, 핵심 주장 자체가 불확실하면 영상 안에서도 짧게 ''확실하지 않다''고 말한다. 편에 따라 사용자가 달리 원하면 그에 따른다.'
- id: shorts:164
  date: 09/29
  skill: history-shorts
  line: 164
  kind: 날짜+결정어
  status: 현행후보
  text: '2026-09-29 교훈: ⑤ 초안이 ''3세기 5부''와 ''기원전 1세기 유리 태자 책봉''을 "실마리는 여기!"로 억지 연결했고, 사용자가 개연성을 지적함. 또 2~4번 문장이 사실 나열이라 흐름이 끊김.'
- id: shorts:187
  date: 09/29
  skill: history-shorts
  line: 187
  kind: 날짜+결정어
  status: 현행후보
  text: '- **첫 장면(v7.3)**: 지도가 아니라 가장 강렬한 장면(인물·긴장) + 상단 제목(4~5어절, `{핵심어}` 금색). 내레이션 첫 문장은 곧바로 이번 편 질문. "자, 옛날 옛적" 같은 도입은 쓰지 않는다(스와이프 방어, 2026-09-29 사용자 결정). 지도는 2번째 장면 이후. ⑤부터 첫 장면은 움직이는 컷(F-4). **v7.6**: 첫 문장은 질문 대신 **결말을 먼저 던지는 한 문장**도 된다(⑨ "아버지가 보낸 칼을 받고 스스로 목숨을 끊은 고구려 태자, 해명."). 사용자가 "약하다"고 한 훅: 원인과 결과를 한 문장에 다 설명하는 문장("선물로 받은 활을 꺾었다가, 아버지에게 칼을 받은 태자가 있습니다")'
- id: shorts:188
  date: 10/12
  skill: history-shorts
  line: 188
  kind: 날짜+결정어
  status: 현행후보
  text: '- **시그니처 3초 축약판(v8.0, 사용자 결정 2026-10-12)**: 신작 첫 장면은 수묵화 스틸 → 먹물 한 방울이 번져 화면을 덮음 → 같은 구도의 움직이는 실사 컷, 모두 약 3초 안. 그 뒤 본편은 청록산수. 채널이 수묵화에서 시작했다는 정체성(concept 7-2)을 쇼츠에도 새기되 훅이 늦어지지 않게 ① 제목은 0.15초부터(지금처럼) ② 첫 내레이션(질문 또는 결말 한 문장)도 0초부터 ③ 실사 컷은 가장 강한 액션 순간(아래 ''첫 장면 구도'' 규칙). 만드는 법 F-5. 실사는 이 3초에만 쓰고 본편 그림체는 바꾸지 않는다. [미검증 — 첫 적용 편에서 시안으로 길이·먹 번짐 속도·톤 차이를 사용자에게 확인]'
- id: shorts:192
  date: 10/17
  skill: history-shorts
  line: 192
  kind: 날짜+결정어
  status: 현행후보
  text: '- **도트 — 매 편 1곳 이상(v8.1, concept 7-3 · 10/17 결정, 10/23 재확인 · 죽음·비극 장면에는 넣지 않음)**: 자체 제작 도트 스프라이트(기마병·행군·배·불꽃 등, sprite.py)가 한 장면을 작게 지나간다. 놓는 자리는 들판·길·물 위(산 단면·건물 속 금지), 그 장면의 움직임과 같은 방향·같은 세력 색. 내레이션에서 언급하지 않는다(정보가 아니라 장식). 체크포인트 3 장면 구성안에 ''도트: n번 장면, 무엇이, 어느 방향''을 한 줄로 적는다. 게임·만화의 실제 그림·로고·캐릭터 도안은 쓰지 않고, 작품 이름도 화면·설명란에 넣지 않는다. 참고 사례: ⑨ 6번 장면 도트 기마 무사, 온돌 편 지게 진 나무꾼'
