  text: '**원칙**: 지형(해안선·강·산지 위치)은 코드가, 그림체는 AI가, 표지·경로·글자는 다시 코드가 맡는다. AI에게 지도를 처음부터 그리게 하지 않는다(해안선이 틀어짐). **사용자가 승인한 한반도 지도(L-5의 korea_full)의 그림체를 채널 표준으로 고정**하고, 새 지도는 항상 그 지도를 두 번째 참조 이미지로 넣어 그림체를 맞춘다(사용자 결정, 2026-09-28).'
