  status: 폐기후보
  text: '- **[10/25 확정 — 채널 고정] 오프닝 = 줄거리 요약 훅(배경지식 0·초등학생 기준)**: 10/23 ''질문 먼저''(E2)를 대체. 결과(질문)만 던지면 원인을 모르는 시청자는 맥락을 못 잡는다 → 질문 전에 **편 전체 줄거리를 3문장으로** 먼저 들려준다. 내레이션 약 15초 + 시그니처 3초 + 제목 ≈ 18~20초'
- id: longform:216
  date: 10/17
  skill: history-longform
  line: 216
  kind: 날짜+결정어
  status: 보류후보
  text: '- (보류 → 10/25 ''줄거리 요약 훅'' 문장 3의 플래시로 흡수) **4부(다음 편)부터 첫 10초 = 전투 컷 빠른 플래시(10/17 사용자 결정, 3부 ''훅이 약하다'')**: ① 0~6초 그 편에서 가장 강한 전투 컷 8~12개를 0.4~0.8초씩, 돌격 → 화살 → 진창 → 충돌 순으로 점점 빠르게, 마지막 한 컷만 약 1초 ② 6~7초 정적(검은 화면 + 바람 소리만) ③ 7~10초 핵심 질문 한 문장 내레이션 → 먹 번짐 시그니처 → 제목. 소리는 그 편 곡의 가장 센 부분 + 컷마다 타격음, 그래도 내레이션보다 작게(K-1). 이미 만든 컷만 쓴다(크레딧 0). 플래시에 쓴 컷은 본편에서 다시 나와도 되지만, 플래시에서는 짧게만 보여 준다(E-6 반복 규칙의 예외). 첫 적용 때 시안을 먼저 보여 준다'
