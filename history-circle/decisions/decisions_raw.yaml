  kind: 날짜+결정어
  status: 폐기후보
  text: 'v7.7 변경(2026-10-04, 사용자 결정 — 렌더러는 v7.6 그대로): ① **도트·깨알 요소는 선택 사항**(v8.1에서 폐지 — 도트 필수) — 기본은 넣지 않는다. 편의 분위기에 맞고 넣을 이유가 분명할 때만 구성 확인 단계에서 선택지로 제안하고, 사용자가 승인한 편에만 넣는다(D-1). 설명란 ''깨알 정보'' 줄도 해당 사항이 있을 때만(J) ② **편성 순서 변경** — 숏폼 ⑩ 이후는 롱폼과 내용이 겹치므로 **롱폼 3부작을 먼저 만들고, 숏폼은 완성된 롱폼 내용으로 이어간다**(A-4, A-5).'
- id: shorts:19
