  text: 'v7.4 변경(2026-09-29, ⑤ 제작 후 사용자 결정): ① 내레이션 **Harrison 다큐체 확정**(D-2, F-2) ② 연도 배지 = **붉은 낙관 ''史'' + 금색 글자, 배경 상자 없음, ◀▶ 없음**(D-3) ③ **영상 화면의 시리즈 표시 제거**, 워터마크는 우상단 ''역사서클'' 글자만 ④ 움직이는 컷 `video` 필드·효과음 없는 컷 구현(F-4, G-2) ⑤ 업로드 제목은 시리즈명·편 번호 유지(J, 화면 표시만 제거).'
