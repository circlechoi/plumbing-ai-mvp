  kind: 날짜+결정어
  status: 현행후보
  text: '## 12. 건축·도시 시리즈 [신설 10/13 · 10/17 도시의 일생 · 10/18 ''그 시절'' 재출발 · 10/23 두 형식 확정]'
- id: channel-concept:351
  date: 10/23
  skill: history-channel-concept
  line: 351
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/23] **두 형식**:'
- id: channel-concept:352
  date: 10/23
  skill: history-channel-concept
  line: 352
  kind: 확정표기
  status: 현행후보
  text: '- (가) **''그 시절 ○○''** — 기본 형식(진행 중). **[10/23] 판단 프레임으로 재정의: "그 시대 사람들은 왜 그렇게 짓기로 했을까?"** — 건축·생활 방식을 ''그들의 판단''(제약 → 선택 → 대가)으로 푼다. 예: 온돌 = 추운 땅에서 바닥을 데우기로 한 판단. 형식·화면은 그대로, 질문 문장과 엔딩의 ''남긴 것''만 판단 언어로 건축·도시만(음식 제외, 10/18). 1편 = 쪽구들(10/19 온돌 편). 엔딩은 다음 편 예고 없이 ''오늘''로 회수할 수 있다. 검토는 0번 두 역할 + history-architecture-shorts 1번 체크포인트'
- id: channel-concept:356
  date: 10/17
  skill: history-channel-concept
  line: 356
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/17] **시리즈의 주인공은 도시다.** 사용자가 궁금한 것: "한 도시가 왜 그 자리에서, 그 모양으로 자랐고, 시대마다 건물은 왜 그렇게 생겼나." 성곽·궁궐·탑 같은 개별 건축은 그 이야기의 부품으로 다룬다'
- id: channel-concept:359
  date: 10/17
  skill: history-channel-concept
  line: 359
  kind: 날짜+결정어
  status: 폐기후보
  text: '- [10/17 결정 → 10/18 중단 → 10/23 **보류**] **「고구려 수도는 왜 세 번 이사했나」** — 메시지가 모호하다는 사용자 판단으로 중단, ''도시의 일생'' 재개 때 다시 검토(졸본 → 국내 → 평양 → 장안성). 졸본 단독은 수도 기간이 약 40년이고 자료가 적어 ''도시의 일생''이 성립하지 않는다는 판단으로 묶었다. 블록 성장 대신 **같은 축척으로 성이 커지는 비교**가 화면의 재미. 제작 문서는 Claude Docs 6ef99cf3. 서울은 2천 년이 이어지는 최고 소재라 시리즈 문법이 다듬어진 뒤에 한다(사용자 판단: "처음부터 하기 아깝다"). 블록 성장 지도 형식은 자료가 많은 장수 도시(경주 등)에서 검증한다 [제안]. 성곽 롱폼(「고구려는 왜 성을 두 개씩 지었나」, 제작 문서 94a6b34f)은 뒤로 미룬다'
- id: channel-concept:360
  date: 10/17
  skill: history-channel-concept
  line: 360
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/17] **해석을 적극적으로 쓴다**(5·5-1번): 단계마다 "이때 수도는 숨는 곳이었다"처럼 [해석] 한 줄로 도시의 성격을 이름 붙인다. 기록·발굴과 해석은 대본 태그 열과 설명란에서 구분한다'
- id: channel-concept:361
  date: 10/13
  skill: history-channel-concept
  line: 361
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/13] 역사서클 **안의 새 시리즈**(별도 채널 아님). 1번 정체성·3번 라디오 기준·5번 해석 원칙·5-1 상상 절차를 그대로 따른다'
- id: channel-concept:362
  date: 10/13
  skill: history-channel-concept
  line: 362
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/13] 범위: 한국에 국한하지 않고 여러 시대·여러 나라. 우선 한국사 도시부터(시대 무관: 고구려·백제·신라·고려·조선)'
- id: channel-concept:363
  date: 10/13
  skill: history-channel-concept
  line: 363
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/13] 그림체: 실사 복원 + 도해 혼합. 청록산수는 쓰지 않는다. 시그니처 3초(수묵 → 먹 번짐 → 실사) 유지, 수묵은 도시·건물 선묘 스케치'
- id: channel-concept:364
  date: 10/13
  skill: history-channel-concept
  line: 364
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/13~14] 도해 = 한지 먹선(한지 바탕 + 먹선 + 진사 강조 1색). 도트 = 깨알 등장(기마병 등, 축척과 무관한 장식, 내레이션에서 언급하지 않음), **매 편 1곳 이상**(7-3)'
- id: channel-concept:365
  date: 10/14
  skill: history-channel-concept
  line: 365
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/14, 첫 쇼츠 피드백] 코드로만 그린 단순 도해는 ''허접하다'' → 단면·배치처럼 그림이 주인공인 장면은 **AI 그림(롱폼 1부 그림지도 화풍) + 코드 표지**로 만든다. 롱폼 그림지도(예: 국내 분지 26f63b4a)는 재활용한다'
- id: channel-concept:366
  date: 10/13
  skill: history-channel-concept
  line: 366
  kind: 확정표기
  status: 현행후보
  text: '- [확정 10/13] 관점: 양식 반, 개발 논리 반 — 도시의 일생에서는 ''개발 논리''가 입지·확장·밀도·인프라 해석으로 들어간다. 사용자 본업(상업용 부동산 개발·투자)이 검토 관점이다. 개발 논리 비유는 대본에 넣는다(10/17 1편: ''집과 대피소를 한 단지에 모은 복합 개발'')'
- id: channel-concept:369
  date: 10/17
  skill: history-channel-concept
  line: 369
  kind: 확정표기
  status: 현행후보
  text: '### 12-1. 프롬프트 — 도시의 일생 [확정 10/17]'
