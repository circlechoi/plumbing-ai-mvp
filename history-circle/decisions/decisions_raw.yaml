  kind: 날짜+결정어
  status: 현행후보
  text: '- **워터마크(v7.4)**: `"watermark":"역사서클"` 글자만(사용자 결정 2026-09-29), 반투명 70%, 전 구간, 우상단(`series`가 있을 때만 가운데). 선택 `"watermark_logo":"fonts/logo.png"` → 원형 로고 56px + 채널명. 로고 원본은 152x140px라 흐림 → 고해상도(1000px 이상, 투명 PNG) 또는 단순화 버전을 받으면 쓴다. sandbox에서 쓰려면 로고가 Higgsfield에 올라가 있어야 함(사용자가 업로드 위젯으로 올림 → URL로 curl).'
