  status: 현행후보
  text: 'v7.3 변경(2026-09-29, 사용자 요청): ① **서사 설계 강화** — 장기 아크(A-5)와 대본 서사 점검표(D-0: 핵심 메시지 한 문장, 문장 간 인과, 시대 소급 금지) ② 첫 장면 규칙 — 상단 제목(검은고딕, 흰색+금색, 첫 장면만) + 지도 대신 강렬한 장면 + 첫 문장이 곧 질문 ③ 하이브리드 자막(2줄 유지 + 핵심 대목 중앙 ''펀치'' 3~4회) ④ 채널 워터마크(로고 + ''역사서클'') ⑤ 컷 템포 약 2~2.5초(효과음 없는 확대 컷) ⑥ 움직이는 컷(Kling v3.0) 편당 1~2개, 생성 전 사용자 검수 ⑦ 좁은 범위 하천 정밀화(han_mask.py·fix_river.py, v7.1) ⑧ 내레이션을 Kings and Generals식 다큐 내레이터로 전환 검토(D-2).'
