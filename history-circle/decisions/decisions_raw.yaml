  kind: 날짜+결정어
  status: 현행후보
  text: '- 장면당 2줄: 1줄(작게, **≤13자**) + 2줄(크게, **≤10자**). 평서문 요약. **v7.5 크기: 1줄 60px / 2줄 80px(마지막 장면 84px)**(사용자 지정 2026-10-03) — 넘으면 840px 안으로 자동 축소되므로 글자 수를 지켜야 커진 효과가 난다(`cap1_size`·`cap2_size`로 조정)'
- id: shorts:236
  date: 10/04
  skill: history-shorts
  line: 236
  kind: 날짜+결정어
  status: 현행후보
  text: '- **상단 제목(v7.5: 영상 내내 표시)**: 첫 장면에서는 크게(92px, y 425), 첫 장면 끝 0.5초 동안 **80%**로 줄며 **y 392에 끝까지 고정**(`title_keep` 기본 0.8 — 사용자 지정, 0이면 첫 장면에만). 제목은 요약·어그로 역할이므로 의외의 사실 + 물음으로 쓰고, 첫 장면 자막은 제목과 겹치지 않는 문구로. **본고딕 Black(Noto Sans KR 가변 서체, fonts/NSK.ttf) 92px**(v7.6, 사용자 결정 2026-10-04 — 검은고딕(Black Han Sans)은 ''꺾·었·했''처럼 획이 많은 글자를 가늘게 그려 글자마다 굵기가 달라 보였다. 획을 덧칠하는 방식은 글자가 뭉개져 기각), 흰 글자 + `{핵심어}` 금색, 굵은 테두리·그림자, 뒤에 상단 어둠 그라데이션. 4~5어절, 12자 넘으면 가운데 띄어쓰기에서 자동 2줄(`\n`으로 지정 가능). 중심 y 425. 0.15초에 크게 떴다가 줄어드는 ''슬램'' + 북 소리'
- id: shorts:237
  date: 09/29
  skill: history-shorts
  line: 237
  kind: 날짜+결정어
  status: 현행후보
  text: '- **좌상단 연도 배지(v7.4, 사용자 결정 2026-09-29)**: 붉은 낙관 ''史'' 문양(46px) + 금색 글자(나눔명조 Bold 38), **배경 상자 없음**(검은 테두리·부드러운 그림자로 가독성). ◀▶ 기호는 쓰지 않는다(`year`에 넣어도 렌더러가 지움). ''기록상''/''약'' 구분은 유지. 낙관 글자는 Noto Serif KR Black(fonts/SEAL.ttf; 없으면 글자 없는 낙관). 후보였던 청동거울·삼족오·해 문양은 미채택(삼족오는 고구려 전용이라 백제·신라 편에 맞지 않음)'
