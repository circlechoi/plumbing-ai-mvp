  status: 현행후보
  text: '- **기본 문체(v8.1, 10/23 사용자 결정)**: 롱폼 D-1의 ''설명하듯 잇는 합니다체''를 바탕으로 ''~죠 / ~요 / 명사 종결''을 섞는 대화체(⑨ 사용자 최종본이 본보기). 같은 어미 연속 0회, 평서 ''~다.'' 종결은 쓰지 않는다. 사실과 해설을 번갈아 끊지 않고, 해설은 문장 안 한 구절로 녹인다(⑨ 교훈). 아래 v7.5 ''~다'' 관련 규칙과 ⑧ 예는 이전 기준'
- id: shorts:235
