# 역사서클 골든 예시 — 구간 단위 (11/04 사용자 승인: 편 단위 대신 구간 단위)
# 규칙
# - 새로 판정하지 않는다. 스킬에 이미 적힌 사용자·편집장 판정만 옮긴다.
# - anchor = 스킬 원문에 그대로 있는 문구(줄 번호 대신). tools/verify_golden.py가 존재를 검사한다.
# - bad = 사용자가 지적한 구간 / good = 고친 뒤 또는 사용자가 좋다고 한 구간
# - dim = 채점표(rubric.md)의 항목. catch = 이 실수를 잡는 장치(lint 검사명 / reviewer / 사용자)
segments:
  # ---------- 대본·훅 ----------
  - id: G01
    dim: 훅
    format: 롱폼
    episode: 대무신왕 1부 통합본
    bad: "훅 없음, 루즈"
    good: "전투 플래시 → 이후 10/25 줄거리 요약 훅(아는 이름 → 약자의 출발 → 결말 한 문장 → '어떻게' 질문)"
    skill: history-longform
    anchor: "1부 통합본: 훅 없음 → 전투 플래시"
    catch: reviewer(유튜브 디렉터)
  - id: G02
    dim: 훅
    format: 롱폼
    episode: 대무신왕 3부 〈칠 일의 안개〉
    bad: "사용자 '훅이 약하다'"
    good: "첫 10초 전투 컷 플래시 → 10/25 줄거리 요약 훅으로 흡수"
    skill: history-longform
    anchor: "3부 완성(10/17): '훅이 약하다'"
    catch: reviewer(유튜브 디렉터)
  - id: G03
    dim: 훅
    format: 전투 쇼츠
    episode: 4편 주필산
