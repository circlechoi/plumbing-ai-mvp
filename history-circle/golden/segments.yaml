    good: "숫자 역설 단언형 훅 + 숨은 부대는 '?' 블록"
    skill: history-battle-shorts
    anchor: "결말 선공개 훅·사신 훅 → '안 끌린다' → 숫자 역설 단언형"
    catch: reviewer(유튜브 디렉터)
